# Template categorical Diffusion Time Estimation configuration.
defaults:
  - _self_

_target_: src.algorithms.dte.DTE
features: null

target_rate: 0.25 # nominal rate
base_rate: 28608.8064 # bunch crossing rate in kHz

predictor:
  _target_: src.algorithms.components.dte.DTEPredictor
  in_dim: 117
  # The paper uses [256, 512, 256] (~340k params). That is two orders of magnitude
  # above every other model here, all of which are sized for L1 trigger deployment,
  # so DTE is kept at comparable capacity to keep the comparison about the method.
  hidden_dims: [64, 32, 16]
  # The predictor emits one logit per ordered diffusion-time bin.
  out_dim: ${algorithm.n_bins}
  dropout: 0.5
  activation: relu

# Categorical DTE settings. n_bins is searched (see dte_optuna.yaml); n_steps and
# beta_start are not, because the bin->noise ladder depends only on the product
# beta_end * n_steps and beta_start > beta_end is a constructor error.
n_steps: 300
n_bins: 7
beta_start: 0.0
beta_end: 0.01
