# Template categorical Diffusion Time Estimation configuration.
defaults:
  - _self_

_target_: src.algorithms.dte.DTE
features: null

target_rate: 0.25 # nominal rate
base_rate: 28608.8064 # bunch crossing rate in kHz

predictor:
  _target_: src.algorithms.components.dte.DTEPredictor
  in_dim: 117
  # Held below the paper's [256, 512, 256], at the capacity of the other models.
  hidden_dims: [64, 32, 16]
  # The predictor emits one logit per ordered diffusion-time bin.
  out_dim: ${algorithm.n_bins}
  dropout: 0.5
  activation: relu

# n_bins is searched; n_steps and beta_start are not, since the noise ladder depends
# only on beta_end * n_steps and beta_start > beta_end is a constructor error.
n_steps: 300
n_bins: 7
beta_start: 0.0
beta_end: 0.01
