# Template image categorical Diffusion Time Estimation configuration.
defaults:
  - _self_

_target_: src.algorithms.image_dte.ImageDTE
features: null

target_rate: 0.01
base_rate: null

predictor:
  _target_: src.algorithms.components.dte.ImageDTEPredictor
  in_channels: 3
  input_size: [32, 32]
  nodes: [32, 64, 128]
  strides: [2, 2]
  # The predictor emits one logit per ordered diffusion-time bin.
  out_dim: ${algorithm.n_bins}
  dropout: 0.0
  activation: relu
  batchnorm: false

# Categorical DTE settings. n_bins is searched (see imagedte_optuna.yaml); n_steps
# and beta_start are not, because the bin->noise ladder depends only on the product
# beta_end * n_steps and beta_start > beta_end is a constructor error.
n_steps: 300
n_bins: 7
beta_start: 0.0
beta_end: 0.01
