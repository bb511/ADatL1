# package callbacks.util

# Per-event scores and weights of every validation pass, laid out as the docstring of
# src/callbacks/score_dump.py says; needs trainer.num_sanity_val_steps: -1.
_target_: src.callbacks.score_dump.ScoreDumpCallback
dirpath: ${paths.log_dir}/scores/${experiment_name}/${run_name}
run_dir: ${paths.output_dir}
keys:
  ["ascore/full", "ascore/mse", "ascore/kl", "ascore/residual_oas", "fit/full"]
# Sets whose scores are stored; null stores every set, the rest are rescored offline.
stored_sets: null
aux_seed: 0
aux_size: 10000
aux_batch_size: 1024
