# @package data

# L1AD data of the 2025 eras E and G, processed as for axov4 and axov5.

defaults:
  - /paths: data_2025E+G
  - data_extractor: minimal_tau_fet
  - data_processor: default_tau_FET
  - data_normalizer: robust
  - data_mlready: default
  - data_awkward2torch: extended_taus
  - l1_scales: default
  - _self_

_target_: src.data.L1AD_datamodule.L1ADDataModule

# Fill in below with paths to folders that contain the raw parquet data.
zerobias: ${paths.zerobias}
signal: ${paths.signal}
background: ${paths.background}

# Get features to train on.
# Select the kinematic features of each standard object.
train_features:
  muons: ['Et', 'eta', 'phi']
  jets: ['Et', 'eta', 'phi']
  egammas: ['Et', 'eta', 'phi']
  taus: ['Et', 'eta', 'phi']
  FET: ['Et', 'phi']

# The batch size of the data.
batch_size: 16384

# Batches kept per auxiliary validation and test set; -1 keeps all.
max_val_batches: 10

# Seed for shuffling the data, if any shuffling is happening.
seed: ${seed}
