# @package data

# The basis data, built by the loader that ships inside the published record.

defaults:
  # Lets an experiment override /data/data_normalizer; the record runs its own.
  - data_normalizer: robust
  - _self_

_target_: src.data.L1AD_HF_datamodule.L1ADHFDataModule

# The former podagiu/... name redirects here.
repo_id: CERN/anomaly_detection_cmsl1t

# The record ships the pipeline too, so the revision pins the data and the code.
revision: 1ac2b91f12ee4d0f6d88e024da36ab7aeaf7e214

# Keyed by the commit, since every stage tests for its cache by existence alone.
cache_dir: ${paths.base_data_dir}/hf/1ac2b91f

# Extra overrides for the record's configuration; quote an element with = and /.
overrides: []

# The batch size of the data.
batch_size: 16384

# How many batches to split the validation data into. -1 means use the full dataset
max_val_batches: 10

# Seed for shuffling the data, if any shuffling is happening.
seed: ${seed}
