# @package data

defaults:
  - _self_

_target_: src.data.CausalChamber_datamodule.CausalChamberDataModule

data_dir: ${paths.base_data_dir}/causal_chamber
dataset_name: lt_interventions_standard_v1
url: https://causalchamber.s3.eu-central-1.amazonaws.com/downloadables/lt_interventions_standard_v1.zip
md5: 476664d024f88e8b7640998bb5e9ee33

batch_size: 64
# Apart from batch_size: the operational score, a diagnostic, averages per-batch
# quantiles over validation normal (Q'', the fit, does not); small batches are slow.
eval_batch_size: 1024
max_val_batches: -1
num_workers: 0

# The reference set is split into train, validation and test (the remainder); each
# intervention into validation and test.
train_fraction: 0.6
val_fraction: 0.2
signal_val_fraction: 0.6

robust_quantiles: [0.05, 0.95]
clip_value: 10.0

# Fixed apart from the training seed, so that every run sees the same rows.
seed: 314159
# The training batches follow the global training seed.
train_seed: ${seed}
# A training half (the halves instances of the catalogues); null keeps every row.
train_fold: null
n_train_folds: 2

# The light tunnel's ten sensor readouts, in model-input order. v_board is left out: it
# reads 1022 or 1023 only, so its robust scale sits at the floor and its 1022 rows alone
# fill the top 1 % of every whitened score.
readouts:
  - current
  - angle_1
  - angle_2
  - ir_1
  - vis_1
  - ir_2
  - vis_2
  - ir_3
  - vis_3
  - v_reg

# One CSV per experiment.
reference: { file: uniform_reference }
# The ten actuator interventions on the light source and the polarizers; labels 1-10 in
# order.
signals:
  uniform_blue_mid: { file: uniform_blue_mid }
  uniform_blue_strong: { file: uniform_blue_strong }
  uniform_green_mid: { file: uniform_green_mid }
  uniform_green_strong: { file: uniform_green_strong }
  uniform_pol_1_mid: { file: uniform_pol_1_mid }
  uniform_pol_1_strong: { file: uniform_pol_1_strong }
  uniform_pol_2_mid: { file: uniform_pol_2_mid }
  uniform_pol_2_strong: { file: uniform_pol_2_strong }
  uniform_red_mid: { file: uniform_red_mid }
  uniform_red_strong: { file: uniform_red_strong }
# Label 0; a set is split as a signal is, a pool member by member.
nulls:
  # The second typical domain: the nine sensor parameters, each changed alone with the
  # actuators at reference, pooled per grade.
  sensor_weak:
    members:
      - { file: uniform_osr_angle_1_weak }
      - { file: uniform_osr_angle_2_weak }
      - { file: uniform_osr_c_weak }
      - { file: uniform_t_ir_1_weak }
      - { file: uniform_t_ir_2_weak }
      - { file: uniform_t_ir_3_weak }
      - { file: uniform_t_vis_1_weak }
      - { file: uniform_t_vis_2_weak }
      - { file: uniform_t_vis_3_weak }
  sensor_mid:
    members:
      - { file: uniform_osr_angle_1_mid }
      - { file: uniform_osr_angle_2_mid }
      - { file: uniform_osr_c_mid }
      - { file: uniform_t_ir_1_mid }
      - { file: uniform_t_ir_2_mid }
      - { file: uniform_t_ir_3_mid }
      - { file: uniform_t_vis_1_mid }
      - { file: uniform_t_vis_2_mid }
      - { file: uniform_t_vis_3_mid }
  sensor_strong:
    members:
      - { file: uniform_osr_angle_1_strong }
      - { file: uniform_osr_angle_2_strong }
      - { file: uniform_osr_c_strong }
      - { file: uniform_t_ir_1_strong }
      - { file: uniform_t_ir_2_strong }
      - { file: uniform_t_ir_3_strong }
      - { file: uniform_t_vis_1_strong }
      - { file: uniform_t_vis_2_strong }
      - { file: uniform_t_vis_3_strong }
  # The six LEDs beside the light sensors, each brightened alone. Every baseline and
  # every untrained model scores them at chance: they differ from the reference only
  # through the drift of v_reg with recording order.
  uniform_l_11_mid: { file: uniform_l_11_mid }
  uniform_l_12_mid: { file: uniform_l_12_mid }
  uniform_l_21_mid: { file: uniform_l_21_mid }
  uniform_l_22_mid: { file: uniform_l_22_mid }
  uniform_l_31_mid: { file: uniform_l_31_mid }
  uniform_l_32_mid: { file: uniform_l_32_mid }
