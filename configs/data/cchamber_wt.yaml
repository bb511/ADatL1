# @package data

defaults:
  - _self_

_target_: src.data.CausalChamber_datamodule.CausalChamberDataModule

data_dir: ${paths.base_data_dir}/causal_chamber
dataset_name: wt_walks_v1
url: https://causalchamber.s3.eu-central-1.amazonaws.com/downloadables/wt_walks_v1.zip
md5: 19bb4e92cbe0b8dff49299b9b509ac36

batch_size: 1024
max_val_batches: -1
num_workers: 0

# The reference regime is split into train, validation and test (the remainder);
# every other regime into validation and test.
train_fraction: 0.6
val_fraction: 0.2
signal_val_fraction: 0.6

robust_quantiles: [0.05, 0.95]
clip_value: 10.0

# Fixed apart from the training seed, so that every run sees the same rows.
seed: 314159
# The batch order follows the global training seed.
train_seed: ${seed}
# A training half (the halves instances of the catalogues); null keeps every row.
train_fold: null
n_train_folds: 2

# The wind tunnel's eleven sensor readouts, in the order of readout_map_wt.yaml.
readouts:
  - pressure_upwind
  - pressure_downwind
  - pressure_ambient
  - pressure_intake
  - mic
  - rpm_in
  - rpm_out
  - current_in
  - current_out
  - signal_1
  - signal_2

# A set is one regime (its flag) of regime_jumps_single.csv; regime 0 is the reference.
reference: { file: regime_jumps_single, where: { flag: 0 } }
# regime_<index>_<intervention target>. The labels 1-26 follow this order.
signals:
  regime_01_v_2: { file: regime_jumps_single, where: { flag: 1 } }
  regime_03_res_out: { file: regime_jumps_single, where: { flag: 3 } }
  regime_04_v_out: { file: regime_jumps_single, where: { flag: 4 } }
  regime_05_hatch: { file: regime_jumps_single, where: { flag: 5 } }
  regime_06_v_1: { file: regime_jumps_single, where: { flag: 6 } }
  regime_07_osr_upwind: { file: regime_jumps_single, where: { flag: 7 } }
  regime_09_osr_upwind: { file: regime_jumps_single, where: { flag: 9 } }
  regime_10_v_out: { file: regime_jumps_single, where: { flag: 10 } }
  regime_11_v_1: { file: regime_jumps_single, where: { flag: 11 } }
  regime_12_res_in: { file: regime_jumps_single, where: { flag: 12 } }
  regime_13_osr_upwind: { file: regime_jumps_single, where: { flag: 13 } }
  regime_14_res_out: { file: regime_jumps_single, where: { flag: 14 } }
  regime_15_osr_downwind: { file: regime_jumps_single, where: { flag: 15 } }
  regime_16_osr_ambient: { file: regime_jumps_single, where: { flag: 16 } }
  regime_17_v_in: { file: regime_jumps_single, where: { flag: 17 } }
  regime_18_hatch: { file: regime_jumps_single, where: { flag: 18 } }
  regime_19_osr_upwind: { file: regime_jumps_single, where: { flag: 19 } }
  regime_21_res_in: { file: regime_jumps_single, where: { flag: 21 } }
  regime_22_v_1: { file: regime_jumps_single, where: { flag: 22 } }
  regime_23_osr_intake: { file: regime_jumps_single, where: { flag: 23 } }
  regime_25_v_1: { file: regime_jumps_single, where: { flag: 25 } }
  regime_27_osr_upwind: { file: regime_jumps_single, where: { flag: 27 } }
  regime_28_osr_intake: { file: regime_jumps_single, where: { flag: 28 } }
  regime_29_osr_ambient: { file: regime_jumps_single, where: { flag: 29 } }
  regime_30_v_in: { file: regime_jumps_single, where: { flag: 30 } }
  regime_31_res_in: { file: regime_jumps_single, where: { flag: 31 } }
# Null regimes, label 0: the false-positive rate under the actuator walk.
nulls:
  null_regime_02: { file: regime_jumps_single, where: { flag: 2 } }
  null_regime_08: { file: regime_jumps_single, where: { flag: 8 } }
  null_regime_20: { file: regime_jumps_single, where: { flag: 20 } }
  null_regime_24: { file: regime_jumps_single, where: { flag: 24 } }
  null_regime_26: { file: regime_jumps_single, where: { flag: 26 } }
