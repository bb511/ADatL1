# @package data

defaults:
  - _self_

_target_: src.data.CausalChamber_datamodule.CausalChamberDataModule

data_dir: ${paths.base_data_dir}/causal_chamber
dataset_name: wt_walks_v1
url: https://causalchamber.s3.eu-central-1.amazonaws.com/downloadables/wt_walks_v1.zip
md5: 19bb4e92cbe0b8dff49299b9b509ac36

batch_size: 64
# Apart from batch_size: the operational score, a diagnostic, averages per-batch
# quantiles over validation normal (Q'', the fit, does not); small batches are slow.
eval_batch_size: 1024
max_val_batches: -1
num_workers: 0

# The reference regime is split into train, validation and test (the remainder);
# every other regime into validation and test.
train_fraction: 0.6
val_fraction: 0.2
signal_val_fraction: 0.6

robust_quantiles: [0.05, 0.95]
clip_value: 10.0

# Fixed apart from the training seed, so that every run sees the same rows.
seed: 314159
# The training batches follow the global training seed.
train_seed: ${seed}
# A training half (the halves instances of the catalogues); null keeps every row.
train_fold: null
n_train_folds: 2

# The wind tunnel's ten sensor readouts, in the order of readout_map_wt.yaml. The
# absolute pressures follow the weather over the 30 h of the file, so that their level
# dates a regime; their differences to the ambient pressure stay put. The three other
# barometers are therefore read relative to pressure_ambient, which carries the weather
# and is left out.
readouts:
  - pressure_upwind
  - pressure_downwind
  - pressure_intake
  - mic
  - rpm_in
  - rpm_out
  - current_in
  - current_out
  - signal_1
  - signal_2
relative_to:
  pressure_upwind: pressure_ambient
  pressure_downwind: pressure_ambient
  pressure_intake: pressure_ambient

# A set is one regime (its flag) of regime_jumps_single.csv; regime 0 is the reference.
reference: { file: regime_jumps_single, where: { flag: 0 } }
# regime_<index>_<intervention target>. The labels 1-7 follow this order. The nine
# res_in, res_out and v_1 regimes are left out: they stand apart from the reference no
# more than the regimes without an intervention do.
signals:
  regime_01_v_2: { file: regime_jumps_single, where: { flag: 1 } }
  regime_04_v_out: { file: regime_jumps_single, where: { flag: 4 } }
  regime_05_hatch: { file: regime_jumps_single, where: { flag: 5 } }
  regime_10_v_out: { file: regime_jumps_single, where: { flag: 10 } }
  regime_17_v_in: { file: regime_jumps_single, where: { flag: 17 } }
  regime_18_hatch: { file: regime_jumps_single, where: { flag: 18 } }
  regime_30_v_in: { file: regime_jumps_single, where: { flag: 30 } }
# Pools of regimes, label 0; a member is split as a signal is.
nulls:
  # The second typical domain: one barometer reads with oversampling 1 instead of 8, the
  # actuators on the walk.
  sensor_osr:
    members:
      - { file: regime_jumps_single, where: { flag: 7 } }
      - { file: regime_jumps_single, where: { flag: 9 } }
      - { file: regime_jumps_single, where: { flag: 13 } }
      - { file: regime_jumps_single, where: { flag: 15 } }
      - { file: regime_jumps_single, where: { flag: 16 } }
      - { file: regime_jumps_single, where: { flag: 19 } }
      - { file: regime_jumps_single, where: { flag: 23 } }
      - { file: regime_jumps_single, where: { flag: 27 } }
      - { file: regime_jumps_single, where: { flag: 28 } }
      - { file: regime_jumps_single, where: { flag: 29 } }
  # The regimes without intervention: the false-positive rate under the actuator walk.
  walk_null:
    members:
      - { file: regime_jumps_single, where: { flag: 2 } }
      - { file: regime_jumps_single, where: { flag: 8 } }
      - { file: regime_jumps_single, where: { flag: 20 } }
      - { file: regime_jumps_single, where: { flag: 24 } }
      - { file: regime_jumps_single, where: { flag: 26 } }
