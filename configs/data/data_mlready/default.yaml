# @package data.data_mlready

_target_: src.data.components.mlready.L1DataMLReady

processed_datapath: ${data.data_processor.cache_root_dir}/processed/${data.data_processor.name}

# Split the zerobias into 60% training, 20% validation, 20% test.
split:
  train: 0.6
  valid: 0.2
  test: 0.2

# Split the auxiliary data into 60-40.
split_aux: 0.6

cache_root_dir: ${paths.data_dir}
# Seed of the train/valid/test permutation (and of the aux valid/test split). 42 is
# the split of every study so far. Another seed needs its own cache, so the name
# carries split_suffix ("" for 42, "_split<seed>" otherwise). Build such a cache once
# with scripts/physics/prepare_split.sh; the stage scripts then set seed,
# split_suffix and require_split_info from DATA_SPLIT_SEED. The frozen split records
# its seed and fractions, so asking a cache for another split fails loudly.
seed: 42
split_suffix: ""
require_split_info: false
name: ${data.data_processor.name}_default${.split_suffix}
