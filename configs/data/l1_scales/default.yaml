# @package data.l1_scales

# L1 trigger scales of all the features, i.e. hardware units to GeV/rad/eta.
# Kept for the pure-rate calculation, which needs physical units. That calculation is
# not implemented yet, so nothing applies these today and the tensors the models see
# stay in integer hardware units.
#
# The eta steps are 0.0870/2 for the calorimeter objects and 0.0870/8 for muons, which
# is four times finer. See docs/README.md in the adl1t_datamaker repository, which is
# the specification these restate.

muons:
  Et: 0.5
  phi: 0.010908307824965
  eta: 0.010875
  phi_vtx: 0.010908307824965
  eta_vtx: 0.010875
  rawEt: 1
  quality: 1
  charge: 1
