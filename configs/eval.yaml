# @package _global_

# The offline evaluation of one lattice of the dump regime, then the selection on it:
#   python src/eval.py eval=<domain> lattice=<experiment_name> [partner=<lattice>]

defaults:
  - _self_
  - paths: default
  - extras: default
  - hydra: default
  - eval: ???
  - optional local: default

task_name: eval
tags: ["eval"]

# The lattice, the directory ${scores_dir}/${lattice} of its dumps.
lattice: ???
# The lattice paired by hyperpoint for UDR (another seed or half); null leaves UDR out.
partner: null
scores_dir: ${paths.log_dir}/scores
out_dir: ${paths.log_dir}/eval/${lattice}
# Replaces data.data_dir of every run's configuration; null keeps it.
data_dir: null
# Replaces every run's signals and nulls by those of data/<sets>.yaml; null keeps them.
sets: null
workers: 1
tracking_uri: file:${paths.log_dir}/mlflow/mlruns
