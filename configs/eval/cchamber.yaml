# @package _global_

# The light tunnel: the dump stores every validation and test set. Every run is evaluated
# on the sets of data/cchamber.yaml, whatever lists it was trained with; a dump of the
# older list (58 single interventions) has its three sensor pools rescored from the
# weights of every epoch, and serves its six LED sets, now nulls, from the store.

defaults:
  - /cap: bank
  - _self_

sets: cchamber

evaluation:
  evaluator:
    _target_: src.evaluation.evaluator.Evaluator
    # The callback configs pass through uninstantiated: every run builds its own.
    _recursive_: false
    accelerator: cpu
    devices: 1
    logger: false
    enable_progress_bar: false
    enable_model_summary: false

    # The callbacks of the validation pass; the test pass runs test_callbacks.
    dump_callbacks:
      anomaly_efficiency:
        _target_: src.evaluation.callbacks.efficiency.AnomalyEfficiencyCallback
        output_name: ascore/full
        ds: null
        # The sensor pools: their pass rates are the false-positive rates on the second
        # typical domain, one per grade. The six LEDs follow, each at chance for every
        # trivial baseline.
        null_ds:
          - sensor_weak
          - sensor_mid
          - sensor_strong
          - uniform_l_11_mid
          - uniform_l_12_mid
          - uniform_l_21_mid
          - uniform_l_22_mid
          - uniform_l_31_mid
          - uniform_l_32_mid
        cvar_summary: 0.25
        log_raw_mlflow: false
      thres_drift:
        _target_: src.evaluation.callbacks.thres_drift.ThresholdDriftCallback
        output_name: ascore/full
        calibration_fraction: 0.5
        split_seed: 12345
        log_raw_mlflow: false
        name: thres_drift
      wasserstein:
        _target_: src.evaluation.callbacks.wasserstein.Wasserstein
        output_name: ascore/full
        dataset_1: normal
        dataset_2: reference_normal
        apply_log1p: true
        log_raw_mlflow: false
        name: wasserstein
      # The pairings of normal with each sensor pool, copies of wasserstein.
      wasserstein_weak:
        _target_: src.evaluation.callbacks.wasserstein.Wasserstein
        output_name: ascore/full
        dataset_1: normal
        dataset_2: sensor_weak
        apply_log1p: true
        log_raw_mlflow: false
        name: wasserstein_weak
      wasserstein_mid:
        _target_: src.evaluation.callbacks.wasserstein.Wasserstein
        output_name: ascore/full
        dataset_1: normal
        dataset_2: sensor_mid
        apply_log1p: true
        log_raw_mlflow: false
        name: wasserstein_mid
      wasserstein_strong:
        _target_: src.evaluation.callbacks.wasserstein.Wasserstein
        output_name: ascore/full
        dataset_1: normal
        dataset_2: sensor_strong
        apply_log1p: true
        log_raw_mlflow: false
        name: wasserstein_strong
      # The CAP bank of normal against the control and each sensor pool: every pairing,
      # evidence map and statistic of cap/bank.yaml, the nn caliper set on the control.
      cap_bank_reference_normal:
        _target_: src.evaluation.callbacks.cap_bank.CAPBankCallback
        output_name: ascore/full
        dataset_1: normal
        dataset_2: reference_normal
        reference: reference_normal
        bank_config: ${cap_bank}
        log_raw_mlflow: false
        name: cap_bank_reference_normal
      cap_bank_sensor_weak:
        _target_: src.evaluation.callbacks.cap_bank.CAPBankCallback
        output_name: ascore/full
        dataset_1: normal
        dataset_2: sensor_weak
        reference: reference_normal
        bank_config: ${cap_bank}
        log_raw_mlflow: false
        name: cap_bank_sensor_weak
      cap_bank_sensor_mid:
        _target_: src.evaluation.callbacks.cap_bank.CAPBankCallback
        output_name: ascore/full
        dataset_1: normal
        dataset_2: sensor_mid
        reference: reference_normal
        bank_config: ${cap_bank}
        log_raw_mlflow: false
        name: cap_bank_sensor_mid
      cap_bank_sensor_strong:
        _target_: src.evaluation.callbacks.cap_bank.CAPBankCallback
        output_name: ascore/full
        dataset_1: normal
        dataset_2: sensor_strong
        reference: reference_normal
        bank_config: ${cap_bank}
        log_raw_mlflow: false
        name: cap_bank_sensor_strong
      ascore_operational:
        _target_: src.evaluation.callbacks.output.OutputCallback
        output_name: ascore/operational
        ds: [normal]
        log_raw_mlflow: false
        name: ascore_operational
      npd:
        _target_: src.evaluation.callbacks.autouad.NPD
        name: npd
      rtm:
        _target_: src.evaluation.callbacks.autouad.RTM
        name: rtm
      eag:
        _target_: src.evaluation.callbacks.autouad.EAG
        name: eag
      mv:
        _target_: src.evaluation.callbacks.goix.MassVolume
        name: mv
      entropy:
        _target_: src.evaluation.callbacks.entropy.LossEntropy
        name: entropy
      sds:
        _target_: src.evaluation.callbacks.sds.SDS
        name: sds
    test_callbacks: [anomaly_efficiency]

    # The sets the validation pass appends after the validation loaders.
    extra_sets:
      aux: true
      train: true
      sds:
        max_rows: 10000
        row_seed: 0

    selection: ${selection}

# The registry of strategies: column in val.csv, mode and MLflow keys per criterion.
selection:
  # The CAP bank enters no criterion until the test bed registers its admissible
  # statistics; consistency is left out until CAP is redefined, and EM because it is
  # degenerate on both tunnels: em_reached is 0 in every AE, VAE and SVDD run.
  criteria:
    drift:
      column: thres_drift/drift_operational
      mode: min
      key: val/summary/operational_drift_ema
    w1:
      column: wasserstein/w1dist
      mode: min
      key: val/summary/w1dist_ema_normal_vs_reference_normal
    w1_weak:
      column: wasserstein_weak/w1dist
      mode: min
      key: val/summary/w1dist_ema_normal_vs_sensor_weak
    w1_mid:
      column: wasserstein_mid/w1dist
      mode: min
      key: val/summary/w1dist_ema_normal_vs_sensor_mid
    w1_strong:
      column: wasserstein_strong/w1dist
      mode: min
      key: val/summary/w1dist_ema_normal_vs_sensor_strong
    npd:
      column: npd/npd
      mode: max
      key: val/summary/npd_ema
      raw_key: val/summary/npd
    rtm:
      column: rtm/rtm
      mode: max
      key: val/summary/rtm_ema
      raw_key: val/summary/rtm
    eag:
      column: eag/eag
      mode: max
      key: val/summary/eag_ema
      raw_key: val/summary/eag
    mv:
      column: mv/mv
      mode: min
      key: val/summary/mv_ema
      raw_key: val/summary/mv
    entropy:
      column: entropy/entropy
      mode: min
      key: val/summary/entropy_ema
      raw_key: val/summary/entropy
      skip_nonfinite: true
    sds:
      column: sds/sds
      mode: min
      key: val/summary/sds_ema
      raw_key: val/summary/sds
  q_sec:
    column: ascore_operational/normal
    key: val/summary/ascore_operational_ema
    raw_key: val/normal/ascore_operational
  # Q' alone, from the per-set validation efficiencies of the signal sets.
  labelled:
    oracle:
      statistic: mean
      key: val/summary/eff_mean_ema_operational
      raw_key: val/summary/eff_mean_operational
    cvar25:
      statistic: cvar
      alpha: 0.25
      key: val/summary/eff_cvar25_ema_operational
      raw_key: val/summary/eff_cvar25_operational
    cvar10:
      statistic: cvar
      alpha: 0.10
      key: val/summary/eff_cvar10_ema_operational
      raw_key: val/summary/eff_cvar10_operational
  # The prefix of the per-set efficiency columns.
  efficiency: eff/eff_operational_
  # Columns intervention and target_cluster; null makes every set its own cluster.
  clusters: ${paths.root_dir}/scripts/cchamber/lt_target_clusters.csv
  lattice_criteria:
    udr: max
    mc: max
  # The known limit of each strategy, for the tables.
  limits:
    drift: distribution-free on i.i.d. normal rows, split with a fixed seed; a dozen or so distinct values, so ties decide its picks
    w1: favours a small score spread; a constant score gives 0, its best value
    w1_weak: favours a small score spread; a constant score gives 0, its best value
    w1_mid: favours a small score spread; a constant score gives 0, its best value
    w1_strong: favours a small score spread; a constant score gives 0, its best value
    rtm: on RealNVP its sign carries no meaning where the median NLL is at or below zero
    mv: degenerate above about eight input dimensions (Goix); the chamber has ten; exactly zero, the floor of its Monte Carlo volume estimate, in some RealNVP epochs
    entropy: on RealNVP undefined, its per-sample loss can be negative; its RealNVP picks can fall on epochs where it is NaN
    sds: in-sample, the pseudo-sets come from the training inputs
    udr: selects the untrained model where its scores do not depend on the seed; on the chamber the barely trained AE and VAE (epoch 0 or 1)
    mc: selects the untrained model where its scores do not depend on the seed; on the chamber the barely trained AE and VAE (epoch 0 or 1)
    q_sec: on SVDD the distance has no fixed scale across a lattice
