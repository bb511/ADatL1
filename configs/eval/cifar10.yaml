# @package _global_

# CIFAR-10: every validation and test set is stored in the dump; the signals are the
# classes 1-9 against class 0.

defaults:
  - /cap: [bank, posterior]
  - _self_

# The bank's beta_fix, declared on CIFAR-10's own lattices by the light tunnel's rule
# (scripts/analysis/cap_beta_fix.py over the roster's five lattices, AE, VAE, SVDD,
# RealNVP and DDL; 08_tests.md 6.10, recorded 3 Nov 2026); a null entry makes a bank
# callback raise at its first computation.
cap_bank:
  beta_fix: { std: 0.9929, rank: 3.0932, sq: 4.6738, disp: 2.1417 }

evaluation:
  evaluator:
    _target_: src.evaluation.evaluator.Evaluator
    # The callback configs pass through uninstantiated: every run builds its own.
    _recursive_: false
    accelerator: cpu
    devices: 1
    logger: false
    enable_progress_bar: false
    enable_model_summary: false

    # The callbacks of the validation pass; the test pass runs test_callbacks.
    dump_callbacks:
      anomaly_efficiency:
        _target_: src.evaluation.callbacks.efficiency.AnomalyEfficiencyCallback
        output_name: ascore/full
        ds: null
        # The corruption pools: their pass rates are the false-positive rates on the
        # second typical domain, one per grade.
        null_ds: [sensor_weak, sensor_mid, sensor_strong]
        cvar_summary: 0.25
        log_raw_mlflow: false
      thres_drift:
        _target_: src.evaluation.callbacks.thres_drift.ThresholdDriftCallback
        output_name: ascore/full
        calibration_fraction: 0.5
        split_seed: 12345
        log_raw_mlflow: false
        name: thres_drift
      wasserstein:
        _target_: src.evaluation.callbacks.wasserstein.Wasserstein
        output_name: ascore/full
        dataset_1: normal
        dataset_2: reference_normal
        apply_log1p: true
        log_raw_mlflow: false
        name: wasserstein
      # The CAP bank of normal against the control and each corruption pool, with the
      # couplings in colour_spectral, standardised on the training normals. A pool's
      # six members are copies of normal under one corruption each, so each is one ot
      # subsample.
      cap_bank_reference_normal:
        _target_: src.evaluation.callbacks.cap_bank.CAPBankCallback
        output_name: ascore/full
        dataset_1: normal
        dataset_2: reference_normal
        reference: reference_normal
        bank_config: ${cap_bank}
        log_raw_mlflow: false
        name: cap_bank_reference_normal
        representation: colour_spectral
        x2_blocks: null
      cap_bank_sensor_weak:
        _target_: src.evaluation.callbacks.cap_bank.CAPBankCallback
        output_name: ascore/full
        dataset_1: normal
        dataset_2: sensor_weak
        reference: reference_normal
        bank_config: ${cap_bank}
        log_raw_mlflow: false
        name: cap_bank_sensor_weak
        representation: colour_spectral
        x2_blocks: 6
      cap_bank_sensor_mid:
        _target_: src.evaluation.callbacks.cap_bank.CAPBankCallback
        output_name: ascore/full
        dataset_1: normal
        dataset_2: sensor_mid
        reference: reference_normal
        bank_config: ${cap_bank}
        log_raw_mlflow: false
        name: cap_bank_sensor_mid
        representation: colour_spectral
        x2_blocks: 6
      cap_bank_sensor_strong:
        _target_: src.evaluation.callbacks.cap_bank.CAPBankCallback
        output_name: ascore/full
        dataset_1: normal
        dataset_2: sensor_strong
        reference: reference_normal
        bank_config: ${cap_bank}
        log_raw_mlflow: false
        name: cap_bank_sensor_strong
        representation: colour_spectral
        x2_blocks: 6
      # ANCAP of normal against each corruption pool, its six members as one view, with
      # no control; its reference, the SDS pseudo-outliers, is the set that
      # extra_sets.sds serves, so that it adds no model pass.
      ancap:
        _target_: src.evaluation.callbacks.threshold_posterior.ThresholdPosterior
        output_name: ascore/full
        dataset_1: normal
        views:
          sensor_weak: sensor_weak
          sensor_mid: sensor_mid
          sensor_strong: sensor_strong
        posterior_config: ${cap_posterior}
        name: ancap
        # ANCAP-W's columns, which the ancap3 criteria read, are off: the override
        # evaluation.evaluator.dump_callbacks.ancap.working_point=true turns them and
        # the ancap3 picks on; without them the selection skips ancap3.
        working_point: false
      # The operational score of normal, a diagnostic column beside Q'', the fit.
      ascore_operational:
        _target_: src.evaluation.callbacks.output.OutputCallback
        output_name: ascore/operational
        ds: [normal]
        log_raw_mlflow: false
        name: ascore_operational
      fit:
        _target_: src.evaluation.callbacks.fit.Fit
        name: fit
      npd:
        _target_: src.evaluation.callbacks.autouad.NPD
        name: npd
      rtm:
        _target_: src.evaluation.callbacks.autouad.RTM
        name: rtm
      eag:
        _target_: src.evaluation.callbacks.autouad.EAG
        name: eag
      entropy:
        _target_: src.evaluation.callbacks.entropy.LossEntropy
        name: entropy
      sds:
        _target_: src.evaluation.callbacks.sds.SDS
        name: sds
    test_callbacks: [anomaly_efficiency]

    # The sets the validation pass appends after the validation loaders.
    extra_sets:
      aux: true
      train: true
      sds:
        max_rows: 10000
        row_seed: 0

    selection: ${selection}

# The registry of strategies: column in val.csv, mode and MLflow keys per criterion.
selection:
  # The CAP bank enters no criterion: the reading takes its columns directly. CAP and
  # consistency are left out because section R of the register reads those columns, and
  # EM and MV because they are degenerate on images (NaN on CIFAR-10). ANCAP and ANCAP-W
  # enter only through ancap3, the band rule on ANCAP-W's columns.
  criteria:
    drift:
      column: thres_drift/drift_operational
      mode: min
      key: val/summary/operational_drift_ema
    w1:
      column: wasserstein/w1dist
      mode: min
      key: val/summary/w1dist_ema_normal_vs_reference_normal
    npd:
      column: npd/npd
      mode: max
      key: val/summary/npd_ema
      raw_key: val/summary/npd
    rtm:
      column: rtm/rtm
      mode: max
      key: val/summary/rtm_ema
      raw_key: val/summary/rtm
    eag:
      column: eag/eag
      mode: max
      key: val/summary/eag_ema
      raw_key: val/summary/eag
    entropy:
      column: entropy/entropy
      mode: min
      key: val/summary/entropy_ema
      raw_key: val/summary/entropy
      skip_nonfinite: true
    sds:
      column: sds/sds
      mode: min
      key: val/summary/sds_ema
      raw_key: val/summary/sds
    # ANCAP v3 (ancap_v3_spec.md, section 2.3), one entry per grade: Q' is ANCAP-W's
    # agreement I_W of the grade, compared only among the candidates whose level f1
    # lies within band_se standard errors of the best level, at the epoch and at the
    # hyperpoint stage. The columns are those of the ancap callback with working_point.
    ancap3_sensor_weak:
      column: ancap/ancapw_sensor_weak
      mode: max
      key: val/summary/ancapw_sensor_weak_ema
      skip_nonfinite: true
      band:
        level: ancap/ancapw_f1
        level_se: ancap/ancapw_f1_se
        se: ancap/ancapw_se_sensor_weak
        band_se: ${cap_posterior.band_se}
    ancap3_sensor_mid:
      column: ancap/ancapw_sensor_mid
      mode: max
      key: val/summary/ancapw_sensor_mid_ema
      skip_nonfinite: true
      band:
        level: ancap/ancapw_f1
        level_se: ancap/ancapw_f1_se
        se: ancap/ancapw_se_sensor_mid
        band_se: ${cap_posterior.band_se}
    ancap3_sensor_strong:
      column: ancap/ancapw_sensor_strong
      mode: max
      key: val/summary/ancapw_sensor_strong_ema
      skip_nonfinite: true
      band:
        level: ancap/ancapw_f1
        level_se: ancap/ancapw_f1_se
        se: ancap/ancapw_se_sensor_strong
        band_se: ${cap_posterior.band_se}
  # Q'', the mean fit of validation normal, minimised; se is the gate's standard error.
  q_sec:
    column: fit/normal
    se: fit/normal_se
    key: val/summary/fit_ema
    raw_key: val/summary/fit
  # Q' alone, from the per-set validation efficiencies of the signal sets.
  labelled:
    oracle:
      statistic: mean
      key: val/summary/eff_mean_ema_operational
      raw_key: val/summary/eff_mean_operational
    cvar25:
      statistic: cvar
      alpha: 0.25
      key: val/summary/eff_cvar25_ema_operational
      raw_key: val/summary/eff_cvar25_operational
    cvar10:
      statistic: cvar
      alpha: 0.10
      key: val/summary/eff_cvar10_ema_operational
      raw_key: val/summary/eff_cvar10_operational
  # The prefix of the per-set efficiency columns.
  efficiency: eff/eff_operational_
  # Columns intervention and target_cluster; null makes every set its own cluster.
  clusters: null
  lattice_criteria:
    udr: max
    mc: max
  # The known limit of each strategy, for the tables.
  limits:
    w1: favours a small score spread; a constant score gives 0, its best value
    rtm: on RealNVP its sign carries no meaning where the median NLL is at or below zero
    entropy: on RealNVP undefined, its per-sample loss can be negative; its RealNVP picks can fall on epochs where it is NaN
    sds: in-sample, the pseudo-sets come from the training inputs; on images the edge test keeps nearly every training row, so the pseudo-outliers are the training set pushed one nearest-neighbour distance outward and SDS reads the score's response to that push
    udr: selects the untrained model where its scores do not depend on the seed
    mc: selects the untrained model where its scores do not depend on the seed
    q_sec: on AE valid as an epoch rule and invalid as a hyperpoint rule on the retrained light tunnel (rho -0.26 at both epochs), and expected so on NAE, scored by the same reconstruction error; the SVDD distance is taken per latent coordinate, since its sum grows with the latent width
