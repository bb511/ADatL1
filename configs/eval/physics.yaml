# @package _global_

# The LHC (L1AD) pool lattices, trained on data=basis_hf in the checkpoint regime with a
# score dump beside it: weights and probe scores at every epoch, validation normal and
# the single-neutrino gun at the sanity pass alone (configs/experiment/physics/*.yaml).
# Every other score is rescored from the weights at every epoch: validation normal
# first, for the cuts. X1 is validation normal and X2 SingleNeutrino_E-10-gun (label
# -1, a background of the efficiency callback). The working point is the q = 0.99 tier,
# 286.088064 kHz; the operational 0.25 kHz columns stay in val.csv and test.csv as
# descriptors. Every criterion is computed for every family; the limits below note where
# one carries no meaning. EM and MV are left out: the uniform box has zero volume (117
# features), which makes both NaN. CAP and consistency (cap_sn_zb of training) are out.

defaults:
  - /cap: bank
  - _self_

# The dumps sit under the name of the training data config.
scores_dir: ${paths.root_dir}/lattices/basis_hf
# The rescored validation normal and single-neutrino scores (score_writer below), for
# UDR, MC and the bank's beta_fix; far larger than the tables, so kept on local disk.
rescored_dir: ${paths.root_dir}/rescored/basis_hf
# A pool trial stopped at a job's time limit leaves fewer epoch files than max_epochs,
# and its driver was relaunched with a fresh seed: listed, left out of replay and pool.
partial_runs: skip

# The bank's beta_fix, declared by the rule of scripts/analysis/cap_beta_fix.py over the
# seven pool lattices' validation normal, capped as row_caps below, at epoch 199 and at
# initial.pt (08_tests.md 8.2, recorded 3 Nov 2026); a null entry makes a bank callback
# raise at its first computation.
cap_bank:
  beta_fix: { std: 1.3898, rank: 3.0994, sq: 6.0697, disp: 1.9418 }

evaluation:
  evaluator:
    _target_: src.evaluation.evaluator.Evaluator
    # The callback configs pass through uninstantiated: every run builds its own.
    _recursive_: false
    accelerator: cpu
    devices: 1
    logger: false
    enable_progress_bar: false
    enable_model_summary: false

    # The callbacks of the validation pass; the test pass runs test_callbacks.
    dump_callbacks:
      anomaly_efficiency:
        _target_: src.evaluation.callbacks.efficiency.AnomalyEfficiencyCallback
        output_name: ascore/full
        ds: null
        null_ds: []
        target_rates: [0.25, 286.088064]
        cvar_summary: 0.25
        log_raw_mlflow: false
      thres_drift:
        _target_: src.evaluation.callbacks.thres_drift.ThresholdDriftCallback
        output_name: ascore/full
        target_rates: [0.25, 286.088064]
        calibration_fraction: 0.5
        split_seed: 12345
        log_raw_mlflow: false
        name: thres_drift
      wasserstein:
        _target_: src.evaluation.callbacks.wasserstein.Wasserstein
        output_name: ascore/full
        dataset_1: normal
        dataset_2: SingleNeutrino_E-10-gun
        apply_log1p: true
        log_raw_mlflow: false
        name: wasserstein
      # The CAP bank of normal against the single-neutrino gun, without a control, in
      # l1_summary, the representation declared for the LHC (08_tests.md 8.2, recorded
      # 3 Nov 2026). Its Et normalisation and L1 scale are the record's
      # (<object>_norm_params.pkl and l1_scales/default.yaml), written as floats and in
      # this order, since the parameters enter the coupling cache's hash. ot needs
      # N2 >= N1 and builds an N1 x N1 matrix, hence the caps (user, recorded 3 Nov
      # 2026). Physics has no control set, so the nn caliper's reference is normal itself:
      # max_rows_1 rows of it disjoint from X1's (user, 2 Nov 2026).
      cap_bank_sn:
        _target_: src.evaluation.callbacks.cap_bank.CAPBankCallback
        output_name: ascore/full
        dataset_1: normal
        dataset_2: SingleNeutrino_E-10-gun
        reference: normal
        bank_config: ${cap_bank}
        log_raw_mlflow: false
        name: cap_bank_sn
        representation: l1_summary
        representation_params:
          et_norm:
            FET: { shift: 29.0, scale: 63.0 }
            egammas: { shift: 6.0, scale: 9.0 }
            jets: { shift: 46.0, scale: 53.0 }
            muons: { shift: 6.0, scale: 13.0 }
            taus: { shift: 10.0, scale: 19.0 }
          et_gev: { FET: 0.5, egammas: 0.5, jets: 0.5, muons: 0.5, taus: 0.5 }
          coordinates:
            - n_jets
            - et_jets
            - n_egammas
            - et_egammas
            - n_muons
            - et_muons
            - n_taus
            - et_taus
            - et_fet
            - lead_jets
            - lead_egammas
            - lead_muons
            - lead_taus
            - et_total
            - n_total
        x2_blocks: null
        max_rows_1: 8000
        max_rows_2: 16000
        row_seed: 0
      # The operational score of normal, a diagnostic column beside Q'', the fit.
      ascore_operational:
        _target_: src.evaluation.callbacks.output.OutputCallback
        output_name: ascore/operational
        ds: [normal]
        log_raw_mlflow: false
        name: ascore_operational
      fit:
        _target_: src.evaluation.callbacks.fit.Fit
        name: fit
      npd:
        _target_: src.evaluation.callbacks.autouad.NPD
        name: npd
      rtm:
        _target_: src.evaluation.callbacks.autouad.RTM
        name: rtm
      eag:
        _target_: src.evaluation.callbacks.autouad.EAG
        name: eag
      entropy:
        _target_: src.evaluation.callbacks.entropy.LossEntropy
        name: entropy
      # Both cut at the q = 0.99 tier, as trained: at the operational FPR of 8.7e-6
      # they saturate near 1.
      sds:
        _target_: src.evaluation.callbacks.sds.SDS
        name: sds
        target_rate: 286.088064
      sds_val:
        _target_: src.evaluation.callbacks.sds.SDS
        name: sds_val
        source: normal
        target_rate: 286.088064
      score_writer:
        _target_: src.evaluation.callbacks.score_writer.ScoreWriter
        dirpath: ${rescored_dir}/${lattice}
        sets: [normal, SingleNeutrino_E-10-gun]
        keys: [ascore/full, fit/full]
    test_callbacks: [anomaly_efficiency]

    # The sets the validation pass appends after the validation loaders, with the rows
    # and seeds of the training callbacks: entropy on 100,000 training rows, SDS on
    # 10,000 distinct rows of the training set and of validation normal.
    extra_sets:
      aux: true
      train:
        max_rows: 100000
        row_seed: 0
        batch_size: 1024
      sds:
        max_rows: 10000
        row_seed: 0
      sds_val:
        max_rows: 10000
        row_seed: 0

    # Rows kept per split and set, a seeded subset fixed across runs and epochs; null
    # keeps every row. Declared from the cost pilot (user, recorded 3 Nov 2026).
    row_caps:
      seed: 0
      val:
        normal: 1000000
        SingleNeutrino_E-10-gun: null
      test:
        normal: 1000000

    selection: ${selection}

# The registry of strategies: column in val.csv, mode and MLflow keys per criterion, the
# keys those the physics training logs.
selection:
  # The CAP bank enters no criterion: the reading takes its columns directly.
  criteria:
    drift:
      column: thres_drift/drift_trate286_088064kHz
      mode: min
      key: val/summary/trate286_088064kHz_drift_ema
    w1:
      column: wasserstein/w1dist
      mode: min
      key: val/summary/w1dist_ema_normal_vs_SingleNeutrino_E-10-gun
    npd:
      column: npd/npd
      mode: max
      key: val/summary/npd_ema
      raw_key: val/summary/npd
    rtm:
      column: rtm/rtm
      mode: max
      key: val/summary/rtm_ema
      raw_key: val/summary/rtm
    eag:
      column: eag/eag
      mode: max
      key: val/summary/eag_ema
      raw_key: val/summary/eag
    entropy:
      column: entropy/entropy
      mode: min
      key: val/summary/entropy_ema
      raw_key: val/summary/entropy
      skip_nonfinite: true
    sds:
      column: sds_286_088064/sds
      mode: min
      key: val/summary/sds_286_088064_ema
      raw_key: val/summary/sds_286_088064
    sds_val:
      column: sds_val_286_088064/sds
      mode: min
      key: val/summary/sds_val_286_088064_ema
      raw_key: val/summary/sds_val_286_088064
  # Q'', the mean fit of validation normal, minimised; se is the gate's standard error.
  q_sec:
    column: fit/normal
    se: fit/normal_se
    key: val/summary/fit_ema
    raw_key: val/summary/fit
  # Q' alone, from the per-set validation efficiencies of the signal sets at 286 kHz.
  labelled:
    oracle:
      statistic: mean
      key: val/summary/eff_mean_ema_286_088064
      raw_key: val/summary/eff_mean_286_088064
    cvar25:
      statistic: cvar
      alpha: 0.25
      key: val/summary/eff_cvar25_ema_286_088064
      raw_key: val/summary/eff_cvar25_286_088064
    cvar10:
      statistic: cvar
      alpha: 0.10
      key: val/summary/eff_cvar10_ema_286_088064
      raw_key: val/summary/eff_cvar10_286_088064
  # The prefix of the per-set efficiency columns, the MLflow key of each and the rate
  # of both, the harvest's tier.
  efficiency: eff/eff_286.088064_
  efficiency_key: "val/{}/eff__ascore_full__brate_286_088064kHz"
  efficiency_rate: 286.088064
  # Columns intervention and target_cluster; null makes every set its own cluster.
  clusters: null
  lattice_criteria:
    udr: max
    mc: max
  # The rows of validation normal that UDR and MC read, a seeded subset of those the
  # score writer keeps; provisional, to be declared from a cost measurement.
  lattice_rows:
    max_rows: 10000
    row_seed: 0
  # The known limit of each strategy, for the tables.
  limits:
    w1: favours a small score spread; a constant score gives 0, its best value
    rtm: on RealNVP its sign carries no meaning, since the negative log-likelihood takes negative values
    entropy: undefined on RealNVP, whose per-sample loss can be negative, and on SVDD, whose training losses reach 0; its picks there can fall on epochs where it is NaN
    sds: in-sample, the pseudo-sets come from the training inputs; cut at 286.088064 kHz, since at the operational FPR of 8.7e-6 it saturates near 1
    sds_val: the pseudo-sets come from validation normal, the set every other criterion reads; cut at 286.088064 kHz, as sds
    udr: selects the untrained model where its scores do not depend on the seed
    mc: selects the untrained model where its scores do not depend on the seed
    q_sec: has no fixed scale across an SVDD lattice; the SVDD distance is taken per latent coordinate, since its sum grows with the latent width
