# @package _global_

# ANCAP v8 on the LHC (L1AD) pool lattices, label-free: the capacity of zero bias
# (normal, S1) against the single-neutrino gun (S2) on the four kinds of pushed points,
# with the condition reported beside it (V8.md of Theory XXXI, step 4, sections 2 and
# 3). The dumps are those that configs/eval/physics.yaml reads; this config does not
# compose that one, and none of its callbacks runs here. No signal set is built, served,
# scored or read (data_overrides, data_dir, val_sets), and no test pass runs.
#   python src/eval.py eval=physics_ancap8 lattice=physics_<family>_pool \
#       data_dir=<a record cache built with data.signal={}>

# The dumps sit under the name of the training data config.
scores_dir: ${paths.root_dir}/lattices/basis_hf
# An out_dir of its own: in eval=physics's, a resume would take that config's complete
# runs for this one's (the lattice step refuses a run without v8's columns). Nothing
# goes to MLflow per epoch, so no run is logged there.
out_dir: ${paths.log_dir}/eval/${lattice}_ancap8
tracking_uri: null
# A pool trial stopped at a job's time limit is listed and left out, as in physics.yaml.
partial_runs: skip
# The twenty signal sets are never built: the record is composed without them, and
# data_dir, the record's cache_dir, must be given on the command line and name a cache
# built the same way. It is built at the first run where it is empty. Before any
# datamodule is built, the replay refuses data_overrides without data_dir, and a cache
# that holds a simulated set outside val_sets (check_record_cache in
# src/evaluation/components/rebuild.py).
data_overrides: ["data.signal={}"]
# The four frozen files of pushed points, lhc_kind1.npz to lhc_kind4.npz (FREEZE.md of
# Theory XXXI, step 4, "The reference rows").
ancap8_points_dir: ${paths.root_dir}/pushed_points/lhc

evaluation:
  evaluator:
    _target_: src.evaluation.evaluator.Evaluator
    # The callback configs pass through uninstantiated: every run builds its own.
    _recursive_: false
    accelerator: cpu
    devices: 1
    logger: false
    enable_progress_bar: false
    enable_model_summary: false

    # The only callback. S1 is zero bias and the one cell the gun (V8.md, section 1,
    # item 1); the reference is the union of the four kinds, n_P = 40,000, the k-th
    # loader of points being kind k (section 2, "The reference"). sizes are the
    # declared sample sizes: 50,000 rows of each view, 10,000 points per kind.
    dump_callbacks:
      ancap8:
        _target_: src.evaluation.callbacks.ancap8.ANCAP8
        output_name: ascore/full
        dataset_1: normal
        views:
          gun: SingleNeutrino_E-10-gun
        points: [lhc_k1, lhc_k2, lhc_k3, lhc_k4]
        kinds: true
        sizes: { n1: 50000, n2: 50000, n_p: 40000 }
        name: ancap8
    # No test pass, so no test loader is built.
    test_callbacks: []

    # The two views alone are served: any other validation loader the datamodule
    # hands out is dropped before any pass, so that none is scored or read.
    val_sets: [normal, SingleNeutrino_E-10-gun]

    # The pushed points alone: no auxiliary probe, training set or SDS pseudo-set. Each
    # file is refused unless its x and mask arrays have the md5s of FREEZE.md.
    extra_sets:
      points:
        lhc_k1:
          path: ${ancap8_points_dir}/lhc_kind1.npz
          md5_x: d0bc2d0f1cc997978ee3261febe59771
          md5_mask: f7876aa159f40c63c7ef70b0b6aed5d6
        lhc_k2:
          path: ${ancap8_points_dir}/lhc_kind2.npz
          md5_x: 82c0bd01630aef22db48b3a9acd90a02
          md5_mask: f7876aa159f40c63c7ef70b0b6aed5d6
        lhc_k3:
          path: ${ancap8_points_dir}/lhc_kind3.npz
          md5_x: 50ac6de682b644f41a0aa53e23c23983
          md5_mask: bba0ed75b410fb8c02e8ab77ea35cf9f
        lhc_k4:
          path: ${ancap8_points_dir}/lhc_kind4.npz
          md5_x: e26e31de29cad4de4ee8747644b007c0
          md5_mask: 380a141646b2c88a2afdf76fedc02f30

    # The views of round 3, which step 5 reads (V8.md, section 6): the rows of
    # capped_loader(loader, 50000, 20261106) of each set (DECLARATION.md of Theory
    # XXII's pass, line 44), the same in every run and epoch.
    row_caps:
      seed: 20261106
      val:
        normal: 50000
        SingleNeutrino_E-10-gun: 50000
    # Both views rescored from the weights at every epoch, initial.pt included, as
    # round 3's stage 4 made them (normal in a pass of its own, then the gun with the
    # points): served from initial.pt, epoch -1 would carry training's GPU scores,
    # which differ from the views in the last bits.
    rescored_sets: [normal, SingleNeutrino_E-10-gun]

    selection: ${selection}

# ANCAP v8 alone: no criterion, Q'' or labelled row, so the lattice step writes v8's
# five tables (src/evaluation/lattice.py) and no labelled table. cells are the keys of
# the callback's views; domain leads every table beside the lattice's name.
selection:
  ancap8:
    name: ancap8
    cells: [gun]
    n_kinds: 4
    domain: physics
