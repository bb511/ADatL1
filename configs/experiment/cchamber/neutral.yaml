# @package _global_

# Train and dump only; selection and evaluation run offline.

defaults:
  - /cap: provisional
  - override /data: cchamber
  - override /algorithm: neutral
  - override /callbacks: dump
  - override /trainer: cpu
  - override /logger: mlflow

seed: 123
tags: ["neutral", "cchamber", "pool"]

experiment_name: cchamber_neutral_pool
run_name: ${short_hash:${hydra:runtime.output_dir},12}

data:
  max_val_batches: -1

trainer:
  gradient_clip_algorithm: norm
  gradient_clip_val: 0.0
  min_epochs: 1
  max_epochs: 150
  # The full sanity pass is the untrained state the dump stores; no checkpoint is kept.
  num_sanity_val_steps: -1
  enable_checkpointing: false

test: false

# Every default lies inside hparams_search/cchamber/neutral_optuna.yaml.
algorithm:
  target_rate: 0.01
  base_rate: null
  in_dim: 10

  encoder:
    nodes: [32, 16, 8]

  n_transforms: 11
  transform_type: residual
  temperature: 0.1

  optimizer:
    _partial_: true
    _target_: torch.optim.AdamW
    lr: 1.0e-3
    weight_decay: 1.0e-4
