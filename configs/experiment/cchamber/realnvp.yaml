# @package _global_

# Train and dump only; selection and evaluation run offline.

defaults:
  - /cap: provisional
  - override /data: cchamber
  - override /algorithm: realnvp
  - override /callbacks: dump
  - override /trainer: cpu
  - override /logger: mlflow

seed: 123
tags: ["realnvp", "cchamber", "pool"]

experiment_name: cchamber_realnvp_pool
run_name: ${short_hash:${hydra:runtime.output_dir},12}

data:
  batch_size: 1024
  max_val_batches: -1

trainer:
  gradient_clip_algorithm: norm
  gradient_clip_val: 0.0
  min_epochs: 1
  max_epochs: 150
  # The full sanity pass is the untrained state the dump stores; no checkpoint is kept.
  num_sanity_val_steps: -1
  enable_checkpointing: false

test: false

# Candidate 000 of Victor's chamber panel.
algorithm:
  target_rate: 0.01
  base_rate: null

  flow:
    input_dim: 10
    n_flows: 6
    hidden_dim: 32
    n_hidden_layers: 2
    activation: relu
    noise_scale: 0.0
    scale_clamp: 5.0
    # Without it the untrained flow scores validation normal at an NLL of 1e3 or more in
    # 333 of the 400 runs of the first lattice, up to 3e16.
    identity_init: true

  optimizer:
    _partial_: true
    _target_: torch.optim.AdamW
    lr: 1.0e-3
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]
    eps: 1e-8
