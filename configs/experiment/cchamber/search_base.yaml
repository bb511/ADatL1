# @package _global_

defaults:
  - /experiment/cchamber/base_agnostic

# Candidate search is deliberately sealed from intervention labels and held-out test
# data. Every model trajectory records all five label-free objectives, so every
# strategy sees exactly the same candidate pool and model initialization.
tags: ["causal_chamber", "label_free_search"]

data:
  seed: 314159
  pairing_strategy: metadata_nearest
  signal_experiments: []

trainer:
  min_epochs: 200
  max_epochs: 200

test: false
evaluation: null

callbacks:
  log_data_mlflow: null
  clear_ckpts: null
  last_epoch_ckpt: null
  anomaly_eff: null
  stable_ascore_operational_ckpt: null
  thres_drift_ema_ckpt: null
  wasserstein_dist_ema_ckpt: null
  cap_ref_ema_ckpt: null

  cap_ref:
    metric_name: cap_metadata_nearest
    pairing_type: none

  cap_random: &cap_random
    _target_: src.callbacks.cap.CAPCallback
    output_name: "ascore/full"
    dataset_1: normal
    dataset_2: reference_normal
    pairing_type: random
    pairing_seed: 271828
    metric_name: cap_random
    cap_metric_config:
      beta0: 1.0
      normalization_type: sigmoid
      normalization_params: null
      energy_type: adaptive
      energy_params:
        scale: 0.5
      regularization_type: none
      regularization_params: null
      binary: true
      lr: 0.01
      n_epochs: 20
      batch_size: 512
      normalize_gradients: true
      process_group: null
      dist_sync_fn: null

  cap_random_seed_271829:
    <<: *cap_random
    pairing_seed: 271829
    metric_name: cap_random_seed271829

  cap_random_seed_271830:
    <<: *cap_random
    pairing_seed: 271830
    metric_name: cap_random_seed271830

  cap_random_seed_271831:
    <<: *cap_random
    pairing_seed: 271831
    metric_name: cap_random_seed271831

  cap_random_seed_271832:
    <<: *cap_random
    pairing_seed: 271832
    metric_name: cap_random_seed271832

  cap_encoder: &cap_encoder
    _target_: src.callbacks.cap.CAPCallback
    output_name: "ascore/full"
    dataset_1: normal
    dataset_2: reference_normal
    pairing_type: precomputed
    pairing_index_path: ${oc.env:CCHAMBER_VALID_PAIR_TABLE}
    metric_name: cap_encoder_nearest
    cap_metric_config:
      beta0: 1.0
      normalization_type: sigmoid
      normalization_params: null
      energy_type: adaptive
      energy_params:
        scale: 0.5
      regularization_type: none
      regularization_params: null
      binary: true
      lr: 0.01
      n_epochs: 20
      batch_size: 512
      normalize_gradients: true
      process_group: null
      dist_sync_fn: null

  cap_encoder_seed_456:
    <<: *cap_encoder
    pairing_index_path: ${oc.env:CCHAMBER_VALID_PAIR_TABLE_SEED456,${oc.env:CCHAMBER_VALID_PAIR_TABLE}}
    metric_name: cap_encoder_seed456

  cap_encoder_seed_789:
    <<: *cap_encoder
    pairing_index_path: ${oc.env:CCHAMBER_VALID_PAIR_TABLE_SEED789,${oc.env:CCHAMBER_VALID_PAIR_TABLE}}
    metric_name: cap_encoder_seed789

  cap_encoder_seed_101112:
    <<: *cap_encoder
    pairing_index_path: ${oc.env:CCHAMBER_VALID_PAIR_TABLE_SEED101112,${oc.env:CCHAMBER_VALID_PAIR_TABLE}}
    metric_name: cap_encoder_seed101112

  cap_encoder_seed_131415:
    <<: *cap_encoder
    pairing_index_path: ${oc.env:CCHAMBER_VALID_PAIR_TABLE_SEED131415,${oc.env:CCHAMBER_VALID_PAIR_TABLE}}
    metric_name: cap_encoder_seed131415
