# @package _global_

# Train and dump only: the run stores its per-epoch scores and weights and its
# resolved configuration, and selection and evaluation happen offline.

defaults:
  - /cap: provisional
  - /callbacks/util@callbacks.residual_state: residual_state
  - override /data: cchamber
  - override /algorithm: vae
  - override /callbacks: dump
  - override /trainer: cpu
  - override /logger: mlflow

seed: 123
tags: ["vae", "cchamber", "pool"]

experiment_name: cchamber_vae_pool
run_name: ${short_hash:${hydra:runtime.output_dir},12}

data:
  batch_size: 1024
  max_val_batches: -1

trainer:
  gradient_clip_algorithm: norm
  gradient_clip_val: 0.0
  min_epochs: 1
  max_epochs: 150
  # The full sanity pass is the untrained state the dump stores; disabling
  # checkpointing drops the ModelCheckpoint that Lightning adds by default.
  num_sanity_val_steps: -1
  enable_checkpointing: false

test: false

# Candidate 000 of the chamber panel.
algorithm:
  target_rate: 0.01
  base_rate: null
  anomaly_score: residual_oas
  kl_scale: 0.1
  kl_warmup_frac: 0.1

  encoder:
    in_dim: 11
    nodes: [32, 16, 4]
    activation: relu
    clamp_zlogvar_range: [-10.0, 6.0]

  optimizer:
    _partial_: true
    _target_: torch.optim.AdamW
    lr: 1.0e-3
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]
    eps: 1e-8
