# @package _global_

defaults:
  - /cap: provisional
  - override /data: cifar10
  - override /algorithm: image_realnvp
  - override /callbacks: dump
  - override /trainer: cpu
  - override /logger: mlflow

seed: 123
tags: ["realnvp", "pool"]

experiment_name: cifar10_realnvp_pool
run_name: ${short_hash:${hydra:runtime.output_dir},12}

data:
  batch_size: 256
  max_val_batches: -1

trainer:
  gradient_clip_algorithm: norm
  gradient_clip_val: 0.0
  min_epochs: 1
  max_epochs: 200
  # The full sanity pass is the untrained state the dump stores; no checkpoint is kept.
  num_sanity_val_steps: -1
  enable_checkpointing: false

test: false

algorithm:
  target_rate: 0.01
  base_rate: null

  flow:
    input_dim: 3072

  optimizer:
    _partial_: true
    _target_: torch.optim.AdamW
    lr: 1.0e-3
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]
    eps: 1e-8
