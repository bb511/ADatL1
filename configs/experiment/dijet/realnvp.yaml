# @package _global_

# Train and dump only; selection and evaluation run offline.

defaults:
  - /cap: provisional
  - override /data: dijet
  - override /algorithm: realnvp
  - override /callbacks: dump
  - override /trainer: cpu
  - override /logger: mlflow

seed: 123
tags: ["realnvp", "dijet", "pool"]

experiment_name: dijet_realnvp_pool
run_name: ${short_hash:${hydra:runtime.output_dir},12}

data:
  max_val_batches: -1

# Every validation and test set at every epoch, and the scores of the SDS pseudo-sets;
# the training losses are rescored offline from the weights (extra_sets.train).
callbacks:
  score_dump:
    keys: ["ascore/full", "fit/full"]
    stored_sets: null
    train_pass: false
    sds:
      max_rows: 10000
      row_seed: 0

trainer:
  gradient_clip_algorithm: norm
  gradient_clip_val: 0.0
  min_epochs: 1
  max_epochs: 200
  # The full sanity pass is the untrained state the dump stores; no checkpoint is kept.
  num_sanity_val_steps: -1
  enable_checkpointing: false

test: false

algorithm:
  target_rate: 0.01
  base_rate: null

  flow:
    input_dim: 7
    n_flows: 6
    hidden_dim: 32
    n_hidden_layers: 2
    activation: relu
    noise_scale: 0.0
    scale_clamp: 5.0
    # Without it the untrained chamber flow scored validation normal at an NLL of 1e3 or
    # more in 333 of the 400 runs of its first lattice, up to 3e16.
    identity_init: true

  optimizer:
    _partial_: true
    _target_: torch.optim.AdamW
    lr: 1.0e-3
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]
    eps: 1e-8
