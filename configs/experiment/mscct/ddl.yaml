# @package _global_

defaults:
  - /cap: provisional
  - override /data: mscct
  - override /algorithm: image_ddl
  - override /callbacks: dump
  - override /trainer: cpu
  - override /logger: mlflow

seed: 123
tags: ["ddl", "pool"]

experiment_name: mscct_ddl_pool
run_name: ${short_hash:${hydra:runtime.output_dir},12}

data:
  batch_size: 256
  max_val_batches: -1

trainer:
  gradient_clip_algorithm: norm
  gradient_clip_val: 0.0
  min_epochs: 1
  max_epochs: 200
  # The full sanity pass is the untrained state the dump stores; no checkpoint is kept.
  num_sanity_val_steps: -1
  enable_checkpointing: false

test: false

# Every default lies inside hparams_search/mscct/ddl_optuna.yaml.
algorithm:
  target_rate: 0.01
  base_rate: null
  input_shape: [3, 32, 32]

  denoiser:
    in_channels: 3
    nodes: [16, 32]
    time_dim: 32
    dropout: 0.0
    activation: silu

  n_steps: 100
  beta_end: 0.02
  n_score_steps: 4

  optimizer:
    _partial_: true
    _target_: torch.optim.AdamW
    lr: 1.0e-3
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]
    eps: 1e-8

# The scores of the SDS pseudo-sets are stored, built as extra_sets.sds of
# configs/eval/mscct.yaml builds them (the replay checks that the two agree): rescoring
# them costs the replay one U-Net pass per score timestep over each pseudo-image (one
# target and at most one outlier per distinct training image, at most 10,000 of them)
# per epoch file.
callbacks:
  score_dump:
    sds:
      max_rows: 10000
      row_seed: 0
