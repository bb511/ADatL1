# @package _global_

defaults:
  - /cap: provisional
  - /callbacks/util@callbacks.score_dump: score_dump
  - override /data: basis
  - override /algorithm: ae
  - override /callbacks: default
  - override /trainer: cpu
  - override /evaluation: default
  - override /evaluation/callbacks: default
  - override /logger: mlflow

seed: 123
tags: ["ae", "pool"]

experiment_name: physics_ae_pool
run_name: ${short_hash:${hydra:runtime.output_dir},12}

data:
  batch_size: 16384
  max_val_batches: 10

trainer:
  gradient_clip_algorithm: norm
  gradient_clip_val: 0.0
  min_epochs: 1
  max_epochs: 200
  # The full sanity pass, which the score dump stores as the untrained state.
  num_sanity_val_steps: -1

test: true

# Metrics reported to optuna, read at the candidate checkpoint.
optimized_metric_config:
  candidate:
    strategy: summary
    metric: cvar25_ema
    criterion: max
  main_metric:
    callback:
      name: eff
      params: {}
    direction: maximize
  sec_metric:
    callback:
      name: fit
      params:
        ckpt_name: null # This will be filled in with the best ckpt of the main metric.
    direction: minimize

algorithm:
  # What rate is the AD algorithm supposed to work at, in kHz.
  target_rate: 0.25
  base_rate: 28608.8064
  # The basis data processing returns 117 features.
  encoder:
    in_dim: 117
  # In the search space, unlike the shared default of 1e-4.
  input_noise_std: 0.0

  optimizer:
    _partial_: true
    _target_: torch.optim.AdamW
    lr: 0.0013029941778430407
    weight_decay: 0.001
    betas: [0.9, 0.999]
    eps: 1e-8

callbacks:
  log_data_mlflow: null
  anomaly_eff:
    _target_: src.callbacks.efficiency.AnomalyEfficiencyCallback
    output_name: "ascore/full"
    # 286.088064 kHz = 0.01 x base_rate, the q = 0.99 tier.
    target_rates: [0.25, 286.088064]
    ema_weight: 0.9

  thres_drift:
    _target_: src.callbacks.thres_drift.ThresholdDriftCallback
    output_name: "ascore/full"
    target_rates: [0.25, 286.088064]
    calibration_fraction: 0.5
    split_seed: 12345
    ema_weight: 0.9

  wasserstein_dist:
    _target_: src.callbacks.wasserstein.WassersteinCallback
    output_name: "ascore/full"
    dataset_1: normal
    dataset_2: SingleNeutrino_E-10-gun
    apply_log1p: true
    ema_weight: 0.9

  cap_sn_zb:
    _target_: src.callbacks.cap.CAPCallback
    output_name: "ascore/full"
    dataset_1: normal
    dataset_2: SingleNeutrino_E-10-gun
    pairing_type: cdf
    cap_metric_config: ${cap}

  consistency_sn_zb:
    _target_: src.callbacks.consistency.PosteriorConsistencyCallback
    output_name: "ascore/full"
    dataset_1: normal
    dataset_2: SingleNeutrino_E-10-gun
    pairing_type: cdf
    cap_metric_config: ${cap}

  # Label-free criteria: entropy on 100,000 training rows, SDS on 10,000 distinct rows.
  # SDS is cut at the q = 0.99 tier, since at the operational rate (an FPR of 8.7e-6)
  # it saturates near 1. EM and MV are left out: the uniform box has zero volume here,
  # which makes both NaN.
  npd:
    _target_: src.callbacks.autouad.NPDCallback
    output_name: "ascore/full"
    ema_weight: 0.9

  # The weights and the three probes' scores at every epoch, for CAP read offline, and
  # validation normal and the single-neutrino gun at the sanity pass alone. aux_seed,
  # aux_size and aux_batch_size keep npd's aux_seed, aux_size and batch_size (0,
  # 10,000, 1,024), so that the dumped autouad scores are NPD's: DTE fixes its
  # evaluation noise per position in a batch.
  score_dump:
    keys: ["ascore/full", "fit/full"]
    stored_sets: []
    initial_sets: [normal, SingleNeutrino_E-10-gun]
    train_pass: false

  rtm:
    _target_: src.callbacks.autouad.RTMCallback
    output_name: "ascore/full"
    ema_weight: 0.9

  eag:
    _target_: src.callbacks.autouad.EAGCallback
    output_name: "ascore/full"
    ema_weight: 0.9

  loss_entropy:
    _target_: src.callbacks.entropy.LossEntropyCallback
    output_name: "loss/full"
    max_rows: 100000
    ema_weight: 0.9

  sds:
    _target_: src.callbacks.sds.SDSCallback
    output_name: "ascore/full"
    source: train
    max_rows: 10000
    ema_weight: 0.9
    target_rate: 286.088064

  sds_val:
    _target_: src.callbacks.sds.SDSCallback
    name: sds_val
    output_name: "ascore/full"
    source: normal
    max_rows: 10000
    ema_weight: 0.9
    target_rate: 286.088064

  fit:
    _target_: src.callbacks.operational.FitCallback
    output_name: "fit/full"
    ema_weight: 0.9

  cvar25_ema_ckpt:
    _target_: pytorch_lightning.callbacks.ModelCheckpoint
    dirpath: "${paths.checkpoints_dir}/${experiment_name}/${run_name}/summary/cvar25_ema/max"
    monitor: "val/summary/eff_cvar25_ema_operational"
    filename: "cvar25_ema"
    save_last: false
    save_top_k: 1
    mode: "max"
    auto_insert_metric_name: False
    save_weights_only: False
    every_n_epochs: 1
    save_on_train_epoch_end: false

  cvar10_ema_ckpt:
