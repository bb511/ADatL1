evaluation:
  evaluator:
    ckpts:
      summary:
        cvar25_ema: ["max"]
        cvar10_ema: ["max"]
        cvar25_ema_286_088064: ["max"]
        cvar10_ema_286_088064: ["max"]
        operational_drift_ema: ["min"]
        trate286_088064kHz_drift_ema: ["min"]
        w1dist_ema_normal_vs_SingleNeutrino_E-10-gun: ["min"]
        cap_ema_normal_vs_SingleNeutrino_E-10-gun: ["max"]
        consistency_ema_normal_vs_SingleNeutrino_E-10-gun: ["max"]
        npd_ema: ["max"]
        rtm_ema: ["max"]
        eag_ema: ["max"]
        entropy_ema: ["min"]
        sds_286_088064_ema: ["min"]
        sds_val_286_088064_ema: ["min"]
        fit_ema: ["min"]
      normal:
        loss: ["min"]

  callbacks:
    anomaly_efficiency:
      _target_: src.evaluation.callbacks.efficiency.AnomalyEfficiencyCallback
      output_name: "ascore/full"
      ds:
        - GluGluHTo2B_Par-MH-125
        - GluGluHto2G_Par-MH-125
        - GluGluHto2G_Par-MH-90
        - GluGluHto2Tau_Par-MH-125
        - GluGlutoHHto2B2WtoLNu2Q_Par-c2-0-kl-1-kt-1
        - HHHto4B2Tau_Par-c3-0-d4-0
        - HHHto6B_Par-c3-0-d4-0
        - SUSYGluGluToBBHTo2B_Par-M-1200
        - SUSYGluGluToBBHToBB_Par-M-120
        - SUSYGluGluToBBHToBB_Par-M-350
        - SUSYGluGluToBBHToBB_Par-M-600
        - TTHTo2C_Par-MH-125
        - TTHto2B_Par-MH-125
        - VBFHTo2C_Par-MH-125
        - VBFHto2B_Par-MH-125
        - VBFHto2Tau_Par-MH-125
        - WtoTauto3Mu
        - ggH-suep-decay
        - smj-case-A
        - haa-4b-ma15
      target_rates: [0.25, 286.088064]
      cvar_summary: 0.25
      log_raw_mlflow: false

    cap_sn_zb:
      _target_: src.evaluation.callbacks.cap.CAP
      output_name: "ascore/full"
      dataset_1: normal
      dataset_2: SingleNeutrino_E-10-gun
      log_raw_mlflow: false
      pairing_type: cdf
      cap_metric_config: ${cap}

    consistency_sn_zb:
      _target_: src.evaluation.callbacks.consistency.PosteriorConsistency
      name: consistency
      output_name: "ascore/full"
      dataset_1: normal
      dataset_2: SingleNeutrino_E-10-gun
      log_raw_mlflow: false
      pairing_type: cdf
      cap_metric_config: ${cap}

    fit:
      _target_: src.evaluation.callbacks.fit.Fit
      name: fit

    thres_drift:
      _target_: src.evaluation.callbacks.thres_drift.ThresholdDriftCallback
      output_name: "ascore/full"
      target_rates: [0.25, 286.088064]
      calibration_fraction: 0.5
      split_seed: 12345
      log_raw_mlflow: false
      name: thres_drift

    wasserstein:
      _target_: src.evaluation.callbacks.wasserstein.Wasserstein
      output_name: "ascore/full"
      dataset_1: normal
      dataset_2: SingleNeutrino_E-10-gun
      apply_log1p: true
      log_raw_mlflow: false
      name: wasserstein
