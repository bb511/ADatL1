# @package _global_

defaults:
  - override /data: basis
  - override /algorithm: ae
  - override /callbacks: default
  - override /trainer: cpu
  - override /evaluation: null
  - override /evaluation/callbacks: null
  - override /logger: none

seed: 123
tags: ["debug", "physics", "ae"]

experiment_name: physics_debug
run_name: ${short_hash:${hydra:runtime.output_dir},12}

data:
  batch_size: 512
  max_val_batches: 2

algorithm:
  target_rate: 0.25
  base_rate: 28608.8064
  encoder:
    in_dim: 117

trainer:
  min_epochs: 1
  max_epochs: 1
  limit_train_batches: 2
  limit_val_batches: 2
  limit_test_batches: 0

test: false

