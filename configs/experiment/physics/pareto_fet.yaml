# @package _global_

# The base physics AE configuration contains the shared data pipeline, model and
# evaluation wiring.  This manifest deliberately overrides every choice that is
# material to the FET.Et validation Pareto study below.
defaults:
  - /experiment/physics/ae
  # Back to the literal candidate. physics/ae selects fet_et_adhoc, whose
  # candidate interpolates FROM algorithm; the algorithm overrides below
  # interpolate the other way, and the two together would be a cycle.
  - override /pareto_study: fet_et
  - _self_

experiment_name: physics_pareto_fet_v1
tags: ["physics", "pareto", "fet-et", "validation", "protocol-v1"]


# The seed and the three search variables are the only runtime overrides to the
# inherited physics/ae experiment.  All other training and evaluation settings
# come from that base configuration and remain visible in the resolved manifest.
seed: ${pareto_study.candidate.autoencoder_seed}

algorithm:
  encoder:
    nodes: ${pareto_study.candidate.encoder_nodes}
  mi_gamma: ${pareto_study.candidate.mi_gamma}
  mi_sensitive_num_bins: ${pareto_study.candidate.mi_sensitive_num_bins}

evaluation:
  leakage_probes:
    enabled: true
    smoke_test:
      max_events_per_split: null

  callbacks:
    anomaly_efficiency:
      write_pareto_summary: true
      write_plots: false

    correlation_matrix:
      enabled: true

    anomaly_auroc:
      _target_: src.evaluation.callbacks.auroc.AnomalyAUROCCallback
      output_name: 'ascore/full'
      ds: ${evaluation.callbacks.anomaly_efficiency.ds}
      max_false_positive_rate: ${div:${algorithm.target_rate},${algorithm.base_rate}}
      pure_normal: false
      score_direction: higher_score_is_more_anomalous
      ckpts:
        loss_total: true
      name: auroc

    latent_collapse:
      _target_: src.evaluation.callbacks.latent_collapse.LatentCollapseDiagnosticsCallback
      architecture_id: ${pareto_study.candidate.architecture_id}
      minimum_joint_code_entropy_bits: ${pareto_study.collapse_constraint.seed_level_rule.minimum_joint_code_entropy_bits}
      minimum_fraction_of_paired_gamma_zero_joint_entropy: ${pareto_study.collapse_constraint.seed_level_rule.minimum_fraction_of_paired_gamma_zero_joint_entropy}
      dataset: normal
      evaluation_split: val
      ckpts:
        loss_total: true
      name: latent_collapse
