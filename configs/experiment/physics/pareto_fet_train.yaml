# @package _global_

# Stage 1 of the Pareto study.
#
# Deliberately a thin overlay: it inherits physics/pareto_fet unchanged and
# caps the epochs. Stage 1 does exactly what an ordinary AE run has always
# done -- fit, then replay the validation split through the new checkpoint and
# run the usual evaluation callbacks -- and additionally leaves a
# run_manifest.yaml and resolved_config.yaml beside loss_total.ckpt so the
# later stages and the study-map builder can find the run.
#
# An earlier version of this file also stripped the training callbacks that
# need the auxiliary signal datasets, and set data.load_aux_in_fit=false, to get
# the job from 15.3 GB down to 10.3 GB. That is reverted, for two reasons.
#
#   1. The evaluation that follows fit needs those datasets and, more subtly,
#      needs the operational threshold that src/callbacks/efficiency.py
#      (anomaly_eff) computes during the fit-time validation loop and stores on
#      the module with _set_thres_on_module. Without it the evaluator raises
#      "Threshold has not been set" (cluster 333975, 2026-09-19, 93 runs).
#   2. That threshold is saved INTO the checkpoint. A checkpoint trained without
#      anomaly_eff therefore carries no thres_operational, so stage 3 would have
#      inherited the same failure later, from a checkpoint that could not be
#      fixed without retraining.
#
# data.load_aux_in_fit still exists in the datamodule and still works; it is
# simply not what this study wants. Anything using it must also drop the
# evaluation that depends on the threshold.

defaults:
  - /experiment/physics/pareto_fet
  - _self_

# The manifest inherits trainer.max_epochs=200 from physics/ae, which no batch
# job finishes. 30 is the agreed ceiling for the study, and it belongs here so
# the resolved manifest records what was actually trained rather than leaving it
# to a submit file that the manifest never sees.
trainer:
  max_epochs: 30
