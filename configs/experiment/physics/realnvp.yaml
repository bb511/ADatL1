# @package _global_

defaults:
  - /cap: provisional
  - override /data: basis
  - override /algorithm: realnvp
  - override /callbacks: default
  - override /trainer: cpu
  - override /evaluation: default
  - override /evaluation/callbacks: default
  - override /logger: mlflow

seed: 123
tags: ["realnvp", "pool"]

experiment_name: physics_realnvp_pool
run_name: ${short_hash:${hydra:runtime.output_dir},12}

data:
  batch_size: 16384
  max_val_batches: 10

trainer:
  gradient_clip_algorithm: norm
  gradient_clip_val: 0.0
  min_epochs: 1
  max_epochs: 200

test: true

# Metrics reported to optuna, read at the candidate checkpoint.
optimized_metric_config:
  candidate:
    strategy: summary
    metric: cvar25_ema
    criterion: max
  main_metric:
    callback:
      name: eff
      params: {}
    direction: maximize
  sec_metric:
    callback:
      name: ascore_operational
      params:
        ckpt_name: null
        test_ds: normal
    direction: minimize

algorithm:
  # What rate is the AD algorithm supposed to work at, in kHz.
  target_rate: 0.25
  base_rate: 28608.8064

  optimizer:
    _partial_: true
    _target_: torch.optim.AdamW
    lr: 0.0013029941778430407
    weight_decay: 0.001
    betas: [0.9, 0.999]
    eps: 1e-8

callbacks:
  log_data_mlflow: null
  anomaly_eff:
    _target_: src.callbacks.efficiency.AnomalyEfficiencyCallback
    output_name: "ascore/full"
    # 286.088064 kHz = 0.01 x base_rate is the q = 0.99 tier, which the old q99 runs set
    # as target_rate=0.01 with base_rate=null; here base_rate applies to every rate.
    target_rates: [0.25, 286.088064]
    ema_weight: 0.9

  thres_drift:
    _target_: src.callbacks.thres_drift.ThresholdDriftCallback
    output_name: "ascore/full"
    target_rates: [0.25, 286.088064]
    calibration_fraction: 0.5
    split_seed: 12345
    ema_weight: 0.9

  wasserstein_dist:
    _target_: src.callbacks.wasserstein.WassersteinCallback
    output_name: "ascore/full"
    dataset_1: normal
    dataset_2: SingleNeutrino_E-10-gun
    apply_log1p: true
    ema_weight: 0.9

  cap_sn_zb:
    _target_: src.callbacks.cap.CAPCallback
    output_name: "ascore/full"
    dataset_1: normal
    dataset_2: SingleNeutrino_E-10-gun
    pairing_type: cdf
    cap_metric_config: ${cap}

  consistency_sn_zb:
    _target_: src.callbacks.consistency.PosteriorConsistencyCallback
    output_name: "ascore/full"
    dataset_1: normal
    dataset_2: SingleNeutrino_E-10-gun
    pairing_type: cdf
    cap_metric_config: ${cap}

  # Label-free criteria (user, 20 Oct 2026): entropy on a seeded 100,000-row subset of the
  # training rows; SDS from 10,000 distinct rows, also on validation normal as sds_val.
  npd:
    _target_: src.callbacks.autouad.NPDCallback
    output_name: "ascore/full"
    ema_weight: 0.9

  rtm:
    _target_: src.callbacks.autouad.RTMCallback
    output_name: "ascore/full"
    ema_weight: 0.9

  eag:
    _target_: src.callbacks.autouad.EAGCallback
    output_name: "ascore/full"
    ema_weight: 0.9

  excess_mass:
    _target_: src.callbacks.goix.ExcessMassCallback
    output_name: "ascore/full"
    ema_weight: 0.9

  mass_volume:
    _target_: src.callbacks.goix.MassVolumeCallback
    output_name: "ascore/full"
    ema_weight: 0.9

  loss_entropy:
    _target_: src.callbacks.entropy.LossEntropyCallback
    output_name: "loss/full"
    max_rows: 100000
    ema_weight: 0.9

  sds:
    _target_: src.callbacks.sds.SDSCallback
    output_name: "ascore/full"
    source: train
    max_rows: 10000
    ema_weight: 0.9

  sds_val:
    _target_: src.callbacks.sds.SDSCallback
    name: sds_val
    output_name: "ascore/full"
    source: normal
    max_rows: 10000
    ema_weight: 0.9

  operational_score:
    _target_: src.callbacks.operational.OperationalScoreCallback
    output_name: "ascore/operational"
    ema_weight: 0.9

  cvar25_ema_ckpt:
    _target_: pytorch_lightning.callbacks.ModelCheckpoint
    dirpath: "${paths.checkpoints_dir}/${experiment_name}/${run_name}/summary/cvar25_ema/max"
    monitor: "val/summary/eff_cvar25_ema_operational"
    filename: "cvar25_ema"
    save_last: false
    save_top_k: 1
    mode: "max"
    auto_insert_metric_name: False
    save_weights_only: False
    every_n_epochs: 1
    save_on_train_epoch_end: false

  cvar10_ema_ckpt:
    _target_: pytorch_lightning.callbacks.ModelCheckpoint
    dirpath: "${paths.checkpoints_dir}/${experiment_name}/${run_name}/summary/cvar10_ema/max"
