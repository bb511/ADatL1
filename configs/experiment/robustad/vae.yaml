# @package _global_

defaults:
  - /cap: provisional
  - override /data: robustad
  - override /algorithm: image_vae
  - override /callbacks: dump
  - override /trainer: cpu
  - override /logger: mlflow

seed: 123
tags: ["vae", "pool"]

experiment_name: robustad_vae_pool
run_name: ${short_hash:${hydra:runtime.output_dir},12}

data:
  subset: pcb
  batch_size: 16
  max_val_batches: -1

trainer:
  gradient_clip_algorithm: norm
  gradient_clip_val: 0.0
  min_epochs: 1
  max_epochs: 200
  # The full sanity pass is the untrained state the dump stores; disabling
  # checkpointing drops the ModelCheckpoint that Lightning adds by default.
  num_sanity_val_steps: -1
  enable_checkpointing: false

test: false

algorithm:
  target_rate: 0.1
  base_rate: null

  encoder:
    in_channels: 3
    input_size: ${data.image_size}
    # One convolutional stage: the pool's width lists are [conv, hidden, latent],
    # and the encoder needs len(nodes) - 2 strides. The algorithm default [2, 2]
    # fits the four-entry CIFAR-10 lists only. The default widths follow the same
    # three-entry form, so the bare experiment instantiates like every pool draw.
    nodes: [16, 32, 64]
    strides: [2]

  optimizer:
    _partial_: true
    _target_: torch.optim.AdamW
    lr: 1.0e-3
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]
    eps: 1e-8
