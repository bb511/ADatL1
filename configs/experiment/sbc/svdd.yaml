# @package _global_

# Train and dump only; selection and evaluation run offline.

defaults:
  - /cap: provisional
  - override /data: sbc
  - override /algorithm: svdd
  - override /callbacks: dump
  - override /trainer: cpu
  - override /logger: mlflow

seed: 123
tags: ["svdd", "sbc", "pool"]

experiment_name: sbc_svdd_pool
run_name: ${short_hash:${hydra:runtime.output_dir},12}

data:
  max_val_batches: -1

trainer:
  gradient_clip_algorithm: norm
  gradient_clip_val: 0.0
  min_epochs: 1
  max_epochs: 200
  # The full sanity pass is the untrained state the dump stores; no checkpoint is kept.
  num_sanity_val_steps: -1
  enable_checkpointing: false

test: false

callbacks:
  # Both keys of every set at every epoch, and the scores of the SDS pseudo-sets; the
  # training loss and every other key are rescored offline from the stored weights.
  score_dump:
    keys: ["ascore/full", "fit/full"]
    stored_sets: null
    train_pass: false
    sds:
      max_rows: 10000
      row_seed: 0

# The encoder has the template's widths [64, 32, 16], one level of the width list.
algorithm:
  target_rate: 0.01
  base_rate: null
  network_weight_decay: 1.0e-6

  encoder:
    in_dim: 5
    nodes: [64, 32, 16]

  optimizer:
    _partial_: true
    _target_: torch.optim.Adam
    lr: 1.0e-3
    weight_decay: 0.0
    betas: [0.9, 0.999]
    eps: 1e-8
