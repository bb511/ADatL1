# @package _global_

# Train and dump only; selection and evaluation run offline.

defaults:
  - /cap: provisional
  - override /data: sbc
  - override /algorithm: svdd
  - override /callbacks: dump
  - override /trainer: cpu
  - override /logger: mlflow

seed: 123
tags: ["svdd", "sbc", "pool"]

experiment_name: sbc_svdd_pool
run_name: ${short_hash:${hydra:runtime.output_dir},12}

data:
  max_val_batches: -1

trainer:
  gradient_clip_algorithm: norm
  gradient_clip_val: 0.0
  min_epochs: 1
  max_epochs: 200
  # The full sanity pass is the untrained state the dump stores; no checkpoint is kept.
  num_sanity_val_steps: -1
  enable_checkpointing: false

test: false

callbacks:
  # The weights and both keys of the auxiliary sets and the SDS pseudo-sets at every
  # epoch, no validation or test set: src/eval.py rescores each of them, the training
  # loss and every other key from the weights. Every set stored took 3.73 to 3.90 MB
  # per epoch file, against 0.37 to 0.54 MB, and 1,336 GB against 125 GB for the eight
  # planned dijet and sbc lattices (12 Nov 2026).
  score_dump:
    keys: ["ascore/full", "fit/full"]
    stored_sets: []
    train_pass: false
    sds:
      max_rows: 10000
      row_seed: 0

# The encoder has the template's widths [64, 32, 16], one level of the width list.
algorithm:
  target_rate: 0.01
  base_rate: null
  network_weight_decay: 1.0e-6

  encoder:
    in_dim: 5
    nodes: [64, 32, 16]

  optimizer:
    _partial_: true
    _target_: torch.optim.Adam
    lr: 1.0e-3
    weight_decay: 0.0
    betas: [0.9, 0.999]
    eps: 1e-8
