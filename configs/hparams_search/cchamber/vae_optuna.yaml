# @package _global_

# The VAE lattice space, the same on both tunnels; the rationale is in the plan.

defaults:
  - override /hydra/sweeper: optuna
  - override /hydra/sweeper/sampler: random

hydra:
  mode: "MULTIRUN"
  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    study_name: pool
    n_jobs: 1
    # Placeholder: a dump-only run reports the worst value of each direction.
    direction: minimize
    n_trials: 50
    storage: sqlite:///logs/optuna/cchamber/vae_pool.db?timeout=600
    params:
      algorithm.optimizer.lr: tag(log, interval(3e-5, 3e-3))
      trainer.gradient_clip_val: choice(0.0, 0.5, 1.0, 2.0)
      algorithm.encoder.nodes: choice([16, 4], [16, 8], [24, 8], [32, 16, 4], [32, 16, 8], [48, 24, 8], [48, 24, 16], [64, 32, 16])
      algorithm.kl_scale: choice(3e-5, 1e-4, 3e-4, 1e-3, 3e-3, 1e-2, 3e-2, 1e-1)
