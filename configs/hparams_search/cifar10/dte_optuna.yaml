# @package _global_

defaults:
  - override /hydra/sweeper: optuna
  - override /hydra/sweeper/sampler: random

# here we define Optuna hyperparameter search
# docs: https://hydra.cc/docs/next/plugins/optuna_sweeper
hydra:
  mode: "MULTIRUN" # set hydra to multirun by default if this config is attached
  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper

    # name of the study to persist optimization results
    study_name: pool

    # number of parallel workers
    n_jobs: 1

    # A placeholder objective: the run only trains and dumps, so it reports the worst
    # value of each direction to Optuna, and the random sampler never reads it.
    direction: [maximize, minimize]

    # total number of runs that will be executed
    n_trials: 15

    # storage URL to persist optimization results
    # for example, you can use SQLite if you set 'sqlite:///example.db'
    storage: sqlite:///logs/optuna/cifar10/dte_pool.db?timeout=600

    # define hyperparameter search space. Assumes using torch.optim.AdamW
    #
    # CIFAR-10 space. n_bins IS searched; n_steps and beta_start are not -- see
    # the comment in physics/dte_optuna.yaml for why, and for why searching
    # n_bins is only sound because ImageDTE normalises the anomaly score by
    # n_bins-1.

    # Space of the shared pool after the review of the submitted version's
    # searches (19 Oct 2026). Clipping, the Adam betas, weight decay and the
    # strides had no measurable effect and take the experiment's values; the
    # learning-rate range is the one shared by every MLP and convolutional
    # family. n_bins loses its near-duplicate levels; batch normalisation and
    # the activation stay, their effects differing by strategy.
    params:
      algorithm.beta_end: tag(log, interval(1e-3, 1e-1))
      algorithm.n_bins: choice(5, 10, 20, 30)
      algorithm.predictor.nodes: choice([16, 32, 64], [32, 64, 128], [32, 64, 256], [64, 128, 256])
      algorithm.predictor.dropout: choice(0.0, 0.25, 0.5)
      algorithm.predictor.activation: choice(relu, gelu, silu)
      algorithm.predictor.batchnorm: choice(false, true)
      algorithm.optimizer.lr: tag(log, interval(3e-5, 1e-2))
