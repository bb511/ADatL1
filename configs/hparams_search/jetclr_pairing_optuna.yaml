# @package _global_

defaults:
  - override /hydra/sweeper: optuna
  - override /hydra/sweeper/sampler: motpe

optimized_metric_config:
  main_metric:
    callback:
      name: pairing_diagnostics
      params: {}
    direction: maximize

hydra:
  mode: "MULTIRUN"
  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    storage: sqlite:///logs/optuna/physics/jetclr_pairing.db
    study_name: pairing_diagnostics
    n_jobs: 1
    direction: maximize
    n_trials: 20
    sampler:
      n_startup_trials: 8
      consider_endpoints: true
      n_ehvi_candidates: 128
    params:
      trainer.gradient_clip_val: choice(0.5, 1.0, 2.0)
      algorithm.optimizer.lr: tag(log, interval(5e-5, 1e-3))
      algorithm.optimizer.weight_decay: choice(1e-6, 1e-5, 1e-4, 3e-4)
      algorithm.loss.temperature: choice(0.05, 0.10, 0.20)
      algorithm.feature_blur.prob: interval(0.05, 0.45)
      algorithm.feature_blur.magnitude: interval(0.03, 0.20)
      algorithm.feature_blur.strength: interval(0.15, 0.60)
      algorithm.object_mask.prob: interval(0.0, 0.08)
      algorithm.lorentz_rotation.prob: choice(0.0, 0.2, 0.4)
      algorithm.model.d_model: choice(32, 64, 128)
      algorithm.model.out_dim: choice(32, 64, 128)
      algorithm.model.n_layers: choice(1, 2, 4)
      algorithm.model.n_heads: choice(4, 8)
      algorithm.model.dim_feedforward: choice(128, 256, 512)
