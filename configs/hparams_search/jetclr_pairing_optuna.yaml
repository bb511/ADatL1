# @package _global_

defaults:
  - override /hydra/sweeper: optuna
  - override /hydra/sweeper/sampler: motpe

optimized_metric_config:
  main_metric:
    callback:
      name: pairing_diagnostics
      params: {}
    direction: maximize

hydra:
  mode: "MULTIRUN"
  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    storage: sqlite:///logs/optuna/physics/jetclr_pairing.db
    study_name: pairing_augmentation
    n_jobs: 1
    direction: maximize
    n_trials: 50
    sampler:
      n_startup_trials: 8
      consider_endpoints: true
      n_ehvi_candidates: 128
    params:
      trainer.gradient_clip_val: choice(0.05, 0.1, 0.5)
      algorithm.optimizer.lr: tag(log, interval(5e-5, 1e-3))
      algorithm.optimizer.weight_decay: choice(1e-6, 1e-5, 1e-4, 3e-4)
      algorithm.loss.temperature: choice(0.05, 0.10, 0.20)
      algorithm.detector_smearing.prob: interval(0.2, 1.0)
      algorithm.detector_smearing.strength: interval(0.1, 1.5)
      algorithm.object_mask.prob: interval(0.2, 1.0)
      algorithm.object_mask.object_prob: interval(0.0, 0.15)
      algorithm.lorentz_rotation.prob: interval(0.0, 1.0)
