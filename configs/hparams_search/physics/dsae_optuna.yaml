# @package _global_

defaults:
  - override /hydra/sweeper: optuna
  - override /hydra/sweeper/sampler: random

hydra:
  mode: "MULTIRUN" # set hydra to multirun by default if this config is attached
  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper

    # storage URL to persist optimization results
    # for example, you can use SQLite if you set 'sqlite:///example.db'
    storage: sqlite:///logs/optuna/physics/dsae_pool.db?timeout=600

    # name of the study to persist optimization results
    study_name: pool

    # number of parallel workers
    n_jobs: 1

    # 'minimize' or 'maximize' the objective
    direction: [maximize, minimize]

    # total number of runs that will be executed
    n_trials: 40

    # define hyperparameter search space. Assumes using torch.optim.AdamW

    # Space of the shared pool after the review of the submitted version's
    # searches (19 Oct 2026). Gradient clipping, the Adam betas, weight decay,
    # the input noise and the Huber delta had no measurable effect on any
    # strategy's objective in 90 studies and take the experiment's values; the
    # learning-rate ceiling is raised because the old fronts pressed 3e-3, and
    # the floor is kept because the Wasserstein and drift fronts select there.
    # Mean pooling was the worst level on every maximising objective and is
    # dropped; rho_nodes extends to [64,32] because the fronts sat on [48,x],
    # the old widest; the per-object widths keep their smallest and largest
    # settings, which the old studies did not separate.
    params:
      algorithm.encoder.pooling: choice(sum, sum_max)
      algorithm.encoder.rho_nodes: choice([32,16], [48,16], [48,24], [64,32])
      algorithm.encoder.object_phi_nodes: choice({FET:[8],egammas:[16,8],jets:[16,8],muons:[8],taus:[16,8]},{FET:[8],egammas:[32,16],jets:[32,16],muons:[8,8],taus:[32,16]})
      algorithm.encoder.add_counts: choice(true, false)
      algorithm.optimizer.lr: tag(log, interval(3e-5, 1e-2))
