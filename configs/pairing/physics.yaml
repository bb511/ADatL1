# @package _global_

# Add this control to any physics experiment with: +pairing=physics
optimized_metric_artifact: true

physics_pairing:
  dataset_1: ZB_run396102 # background 0: 2025E
  dataset_2: ZB_run398183 # background 1: 2025G
  artifact_dir: ${oc.env:PHYSICS_PAIRING_DIR,${paths.data_dir}/pairing/ZB_run396102_to_ZB_run398183}
  source_metadata_dir: ${physics_pairing.artifact_dir}/sources

  # Select exactly one deterministic pairing strategy for CAP.
  strategy: physics_summary
  # strategy: flat_physical
  # strategy: typed_sliced_wasserstein
  # strategy: jetclr
  # Empirical-CDF control is configured separately with pairing=physics_cdf.

  # Must equal data.batch_size * data.max_val_batches for each named stream.
  events: 163840

  validation_table: ${physics_pairing.artifact_dir}/validate_${physics_pairing.strategy}_cap_n${physics_pairing.events}.pt
  test_table: ${physics_pairing.artifact_dir}/test_${physics_pairing.strategy}_cap_n${physics_pairing.events}.pt

callbacks:
  thres_drift:
    dataset_1: ${physics_pairing.dataset_1}
    dataset_2: ${physics_pairing.dataset_2}

  wasserstein_dist:
    dataset_1: ${physics_pairing.dataset_1}
    dataset_2: ${physics_pairing.dataset_2}

  cap_sn_zb:
    dataset_1: ${physics_pairing.dataset_1}
    dataset_2: ${physics_pairing.dataset_2}
    pairing_type: mapping
    pairing_index_path: ${physics_pairing.validation_table}
  cap_sn_zb_ema_ckpt:
    dirpath: "${paths.checkpoints_dir}/${experiment_name}/${run_name}/summary/cap_ema_${physics_pairing.dataset_1}_vs_${physics_pairing.dataset_2}/max"
    monitor: "val/summary/cap_ema_${physics_pairing.dataset_1}_vs_${physics_pairing.dataset_2}"
    filename: "cap_ema_${physics_pairing.dataset_1}_vs_${physics_pairing.dataset_2}"

  wasserstein_dist_ema_ckpt:
    dirpath: "${paths.checkpoints_dir}/${experiment_name}/${run_name}/summary/w1dist_ema_${physics_pairing.dataset_1}_vs_${physics_pairing.dataset_2}/min"
    monitor: "val/summary/w1dist_ema_${physics_pairing.dataset_1}_vs_${physics_pairing.dataset_2}"
    filename: "w1dist_ema_${physics_pairing.dataset_1}_vs_${physics_pairing.dataset_2}"

evaluation:
  evaluator:
    ckpts:
      summary:
        w1dist_ema_normal_vs_SingleNeutrino_E-10-gun: null
        cap_ema_normal_vs_SingleNeutrino_E-10-gun: null
        w1dist_ema_ZB_run396102_vs_ZB_run398183: ["min"]
        cap_ema_ZB_run396102_vs_ZB_run398183: ["max"]
  callbacks:
    cap_sn_zb:
      dataset_1: ${physics_pairing.dataset_1}
      dataset_2: ${physics_pairing.dataset_2}
      pairing_type: mapping
      pairing_index_path: ${physics_pairing.validation_table}
      pairing_test_index_path: ${physics_pairing.test_table}
    wasserstein:
      dataset_1: ${physics_pairing.dataset_1}
      dataset_2: ${physics_pairing.dataset_2}
    thres_drift:
      dataset_1: ${physics_pairing.dataset_1}
      dataset_2: ${physics_pairing.dataset_2}
