# @package _global_

# Downstream signals are excluded from search and restored only after every
# strategy-specific Pareto front has been frozen.
test: true

callbacks:
  # Retrain segments restore checkpoint callbacks from the previous boundary;
  # clearing their run directory would destroy last/primary/stable candidates.
  clear_ckpts: null
  # Validation-end checkpoints precede Lightning's completed-epoch loop update
  # and repeat the boundary epoch after a process restart. Keep the continuation
  # checkpoint distinct from the reported metric/stable candidates and save it
  # only after validation and the completed-epoch bookkeeping have finished.
  last_epoch_ckpt:
    filename: epoch={epoch}-step={step}
    auto_insert_metric_name: false
    save_last: true
    save_top_k: 1
    save_on_train_epoch_end: true
  exact_rng_state:
    _target_: src.callbacks.exact_retrain_rng.ExactRetrainRNGState
    require_datamodule_shuffler: true
  anomaly_eff:
    _target_: src.callbacks.efficiency.AnomalyEfficiencyCallback
    output_name: ascore/full
    beta: 0.9

evaluation:
  callbacks:
    anomaly_efficiency:
      _target_: src.evaluation.callbacks.efficiency.AnomalyEfficiencyCallback
      name: eff_native
      output_name: ascore/full
      ds:
        - GluGluHTo2B_Par-MH-125
        - GluGluHto2G_Par-MH-125
        - GluGluHto2G_Par-MH-90
        - GluGluHto2Tau_Par-MH-125
        - GluGlutoHHto2B2WtoLNu2Q_Par-c2-0-kl-1-kt-1
        - HHHto4B2Tau_Par-c3-0-d4-0
        - HHHto6B_Par-c3-0-d4-0
        - SUSYGluGluToBBHTo2B_Par-M-1200
        - SUSYGluGluToBBHToBB_Par-M-120
        - SUSYGluGluToBBHToBB_Par-M-350
        - SUSYGluGluToBBHToBB_Par-M-600
        - TTHTo2C_Par-MH-125
        - TTHto2B_Par-MH-125
        - VBFHTo2C_Par-MH-125
        - VBFHto2B_Par-MH-125
        - VBFHto2Tau_Par-MH-125
        - WtoTauto3Mu
        - ggH-suep-decay
        - smj-case-A
        - haa-4b-ma15
      cvar_summary: 0.25
      log_raw_mlflow: false
