# @package _global_

defaults:
  - physics_background_native
  - _self_

# OAS has its own validation-derived operating threshold. Native score state and
# threshold names remain unchanged for paper-compatible comparisons.
callbacks:
  anomaly_eff_oas:
    _target_: src.callbacks.efficiency.AnomalyEfficiencyCallback
    output_name: ascore/residual_oas
    beta: 0.9
    threshold_namespace: residual_oas
    metric_suffix: residual_oas

evaluation:
  callbacks:
    anomaly_efficiency_oas:
      _target_: src.evaluation.callbacks.efficiency.AnomalyEfficiencyCallback
      name: eff_residual_oas
      output_name: ascore/residual_oas
      threshold_namespace: residual_oas
      ds:
        - GluGluHTo2B_Par-MH-125
        - GluGluHto2G_Par-MH-125
        - GluGluHto2G_Par-MH-90
        - GluGluHto2Tau_Par-MH-125
        - GluGlutoHHto2B2WtoLNu2Q_Par-c2-0-kl-1-kt-1
        - HHHto4B2Tau_Par-c3-0-d4-0
        - HHHto6B_Par-c3-0-d4-0
        - SUSYGluGluToBBHTo2B_Par-M-1200
        - SUSYGluGluToBBHToBB_Par-M-120
        - SUSYGluGluToBBHToBB_Par-M-350
        - SUSYGluGluToBBHToBB_Par-M-600
        - TTHTo2C_Par-MH-125
        - TTHto2B_Par-MH-125
        - VBFHTo2C_Par-MH-125
        - VBFHto2B_Par-MH-125
        - VBFHto2Tau_Par-MH-125
        - WtoTauto3Mu
        - ggH-suep-decay
        - smj-case-A
        - haa-4b-ma15
      cvar_summary: 0.25
      log_raw_mlflow: false
