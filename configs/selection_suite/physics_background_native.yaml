    dirpath: "${paths.checkpoints_dir}/${experiment_name}/${run_name}/summary/cap_native_typed_sliced_wasserstein_ema_ZB_run396102_vs_ZB_run398183/max"
    monitor: "val/summary/cap_native_typed_sliced_wasserstein_ema_ZB_run396102_vs_ZB_run398183"
    filename: "cap_native_typed_sliced_wasserstein_ema_ZB_run396102_vs_ZB_run398183"
    save_last: false
    save_top_k: 1
    mode: "max"
    auto_insert_metric_name: false
    save_weights_only: false
    every_n_epochs: 1
    save_on_train_epoch_end: false

  cap_native_jetclr_ema_ckpt:
    _target_: pytorch_lightning.callbacks.ModelCheckpoint
    dirpath: "${paths.checkpoints_dir}/${experiment_name}/${run_name}/summary/cap_native_jetclr_ema_ZB_run396102_vs_ZB_run398183/max"
    monitor: "val/summary/cap_native_jetclr_ema_ZB_run396102_vs_ZB_run398183"
    filename: "cap_native_jetclr_ema_ZB_run396102_vs_ZB_run398183"
    save_last: false
    save_top_k: 1
    mode: "max"
    auto_insert_metric_name: false
    save_weights_only: false
    every_n_epochs: 1
    save_on_train_epoch_end: false

  cap_native_cdf_ema_ckpt:
    _target_: pytorch_lightning.callbacks.ModelCheckpoint
    dirpath: "${paths.checkpoints_dir}/${experiment_name}/${run_name}/summary/cap_native_cdf_ema_ZB_run396102_vs_ZB_run398183/max"
    monitor: "val/summary/cap_native_cdf_ema_ZB_run396102_vs_ZB_run398183"
    filename: "cap_native_cdf_ema_ZB_run396102_vs_ZB_run398183"
    save_last: false
    save_top_k: 1
    mode: "max"
    auto_insert_metric_name: false
    save_weights_only: false
    every_n_epochs: 1
    save_on_train_epoch_end: false

  wasserstein_native_ema_ckpt:
    _target_: pytorch_lightning.callbacks.ModelCheckpoint
    dirpath: "${paths.checkpoints_dir}/${experiment_name}/${run_name}/summary/w1dist_native_ema_ZB_run396102_vs_ZB_run398183/min"
    monitor: "val/summary/w1dist_native_ema_ZB_run396102_vs_ZB_run398183"
    filename: "w1dist_native_ema_ZB_run396102_vs_ZB_run398183"
    save_last: false
    save_top_k: 1
    mode: "min"
    auto_insert_metric_name: false
    save_weights_only: false
