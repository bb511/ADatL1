evaluation:
  evaluator:
    ckpts:
      last: true
      summary:
        operational_drift_ema: null
        w1dist_ema_normal_vs_SingleNeutrino_E-10-gun: null
        cap_ema_normal_vs_SingleNeutrino_E-10-gun: null
        w1dist_ema_ZB_run396102_vs_ZB_run398183: null
        cap_ema_ZB_run396102_vs_ZB_run398183: null
        cap_native_flat_physical_ema_ZB_run396102_vs_ZB_run398183: ["max"]
        cap_native_physics_summary_ema_ZB_run396102_vs_ZB_run398183: ["max"]
        cap_native_typed_sliced_wasserstein_ema_ZB_run396102_vs_ZB_run398183:
          ["max"]
        cap_native_jetclr_ema_ZB_run396102_vs_ZB_run398183: ["max"]
        cap_native_cdf_ema_ZB_run396102_vs_ZB_run398183: ["max"]
        w1dist_native_ema_ZB_run396102_vs_ZB_run398183: ["min"]
        native_operational_drift_ema: ["min"]
      single:
        ascore_operational: ["stable"]
  callbacks:
    anomaly_efficiency: null
    cap_sn_zb: null
    wasserstein: null
    thres_drift: null
    reco: null

    ascore_operational:
      ds: [normal]

    cap_native_flat_physical:
      _target_: src.evaluation.callbacks.cap.CAP
      name: cap_native_flat_physical
      output_name: ${physics_selection.native_output}
      dataset_1: ${physics_pairing.dataset_1}
      dataset_2: ${physics_pairing.dataset_2}
      pairing_type: mapping
      pairing_index_path: ${physics_pairing.artifact_dir}/validate_flat_physical_cap_n${physics_pairing.events}.pt
      pairing_test_index_path: ${physics_pairing.artifact_dir}/test_flat_physical_cap_n${physics_pairing.events}.pt
      cap_metric_config: ${physics_selection.cap_metric_config}
      log_raw_mlflow: false

    cap_native_physics_summary:
      _target_: src.evaluation.callbacks.cap.CAP
      name: cap_native_physics_summary
      output_name: ${physics_selection.native_output}
      dataset_1: ${physics_pairing.dataset_1}
      dataset_2: ${physics_pairing.dataset_2}
      pairing_type: mapping
      pairing_index_path: ${physics_pairing.artifact_dir}/validate_physics_summary_cap_n${physics_pairing.events}.pt
      pairing_test_index_path: ${physics_pairing.artifact_dir}/test_physics_summary_cap_n${physics_pairing.events}.pt
      cap_metric_config: ${physics_selection.cap_metric_config}
      log_raw_mlflow: false

    cap_native_typed_sliced_wasserstein:
      _target_: src.evaluation.callbacks.cap.CAP
      name: cap_native_typed_sliced_wasserstein
      output_name: ${physics_selection.native_output}
      dataset_1: ${physics_pairing.dataset_1}
      dataset_2: ${physics_pairing.dataset_2}
      pairing_type: mapping
      pairing_index_path: ${physics_pairing.artifact_dir}/validate_typed_sliced_wasserstein_cap_n${physics_pairing.events}.pt
      pairing_test_index_path: ${physics_pairing.artifact_dir}/test_typed_sliced_wasserstein_cap_n${physics_pairing.events}.pt
      cap_metric_config: ${physics_selection.cap_metric_config}
      log_raw_mlflow: false

    cap_native_jetclr:
      _target_: src.evaluation.callbacks.cap.CAP
      name: cap_native_jetclr
      output_name: ${physics_selection.native_output}
      dataset_1: ${physics_pairing.dataset_1}
      dataset_2: ${physics_pairing.dataset_2}
      pairing_type: mapping
      pairing_index_path: ${physics_pairing.artifact_dir}/validate_jetclr_cap_n${physics_pairing.events}.pt
      pairing_test_index_path: ${physics_pairing.artifact_dir}/test_jetclr_cap_n${physics_pairing.events}.pt
      cap_metric_config: ${physics_selection.cap_metric_config}
      log_raw_mlflow: false

    cap_native_cdf:
      _target_: src.evaluation.callbacks.cap.CAP
      name: cap_native_cdf
      output_name: ${physics_selection.native_output}
      dataset_1: ${physics_pairing.dataset_1}
      dataset_2: ${physics_pairing.dataset_2}
      pairing_type: cdf
      cap_metric_config: ${physics_selection.cap_metric_config}
      log_raw_mlflow: false

    wasserstein_native:
      _target_: src.evaluation.callbacks.wasserstein.Wasserstein
      name: wasserstein_native
      output_name: ${physics_selection.native_output}
      dataset_1: ${physics_pairing.dataset_1}
      dataset_2: ${physics_pairing.dataset_2}
      apply_log1p: true
      log_raw_mlflow: false

    drift_native:
      _target_: src.evaluation.callbacks.thres_drift.ThresholdDriftCallback
      name: drift_native
      output_name: ${physics_selection.native_output}
      dataset_1: ${physics_pairing.dataset_1}
      dataset_2: ${physics_pairing.dataset_2}
      calibration_fraction: 0.5
      split_seed: 12345
      log_raw_mlflow: false
