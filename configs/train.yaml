# @package _global_

# specify here default configuration
# order of defaults determines the order in which configs override each other
defaults:
  - _self_
  - data: basis
  - algorithm: ae
  - callbacks: default
  - trainer: default
  - evaluation: null
  - evaluation/callbacks: null
  - pareto_study: null
  - paths: default
  - extras: default
  - hydra: default
  - logger: none

  # experiment configs allow for version control of specific hyperparameters
  # e.g. best hyperparameters for given model and datamodule
  - experiment: null

  # config for hyperparameter optimization
  - hparams_search: null

  # optional local config for machine/user specific settings
  # it's optional since it doesn't need to exist and is excluded from version control
  - optional local: default

  # debugging config (enable through command line, e.g. `python train.py debug=default)
  - debug: null

# task name, determines output directory path
task_name: "train"

# tags to help you identify your experiments
# you can overwrite this in experiment configs
# overwrite from command line with `python train.py tags="[first_tag, second_tag]"`
tags: ["dev"]

# set False to skip model training
train: True

# evaluate on test set, using best model weights achieved during training
# lightning chooses best weights based on the metric specified in checkpoint callback
test: True

# simply provide checkpoint path to resume training
ckpt_path: null

# Run the post-fit evaluator in stage 1: fit, then replay the validation split
# through the new checkpoint with every evaluation callback. For the Pareto
# study this IS the evaluation (efficiencies, correlation matrices / E, latent
# collapse, AUROC); no later stage repeats it. Set false only
# for quick runs, or with data.load_aux_in_fit=false, where it cannot work; the
# checkpoint can then be evaluated later with src/run_eval_metrics.py.
run_validation: true

# Split replayed by the evaluation-only entrypoint src/run_eval_metrics.py:
# val (re-evaluation / backfill of a validation run) or test
# (scripts/physics/runae_test.sh, only for configurations already selected on
# validation). src/train.py does not read it.
eval_split: val

# Stage 2 and src/run_eval_metrics.py refuse to analyse a checkpoint whose
# run_manifest.yaml does not match the composed config. Set false for runs
# trained before manifests existed; the stage then warns instead of stopping.
manifest_strict: true

# seed for random number generators in pytorch, numpy and python.random
seed: null
