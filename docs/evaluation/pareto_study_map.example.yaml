# Phase 2 input. Paths may be absolute or relative to this file.
# List every planned configuration/seed run explicitly; the collector does not
# infer identity from directory names or scan checkpoint folders.
schema_version: 1
study_id: fet-et-pareto-v1
protocol_version: fet-et-pareto-v1
expected_autoencoder_seeds: [123, 456, 789]

runs:
  - configuration_id: fet-et-pareto-v1__gamma-0.0__bins-50__arch-h64_32
    autoencoder_seed: 123
    # The resolved manifest is under Hydra's output directory.
    manifest_path: /absolute/path/to/logs/train/runs/.../pareto_manifest.resolved.yaml
    # Checkpoints and compact evaluation artifacts are stored separately.
    checkpoint_run_dir: /absolute/path/to/checkpoints/physics_pareto_fet_v1/...

  # Add one entry for every other paired seed and every other candidate.
  # The collector validates this map against the manifest and artifacts, then
  # writes <output-dir>/<configuration-id>/pareto_metrics.json plus study-wide
  # pareto_metrics.csv and pareto_metrics.parquet.
