# Intervention -> directly affected readout map for the Causal Chamber light tunnel,
# dataset lt_interventions_standard_v1. Drafted 2026-10-07 from primary documentation only;
# the drafting notes on its sources, status rules and points of doubt are not in the
# repository.
#
# Top-level keys are exactly the 58 interventions of lt_target_clusters.csv in this
# directory.
# Fields requested: parameter, reference_value, intervened_value, affected_readouts,
# direction, status, source. Fields added: parameter_symbol, parameter_meaning,
# value_source, data_check, graph_edges, direction_inferred, direction_basis,
# effects_outside_model_inputs, notes.
#
# direction holds only what the documentation states or shows, per readout:
#   increase | decrease          shift of the readout's level
#   variance_decrease            higher precision; no mean shift documented
#   saturation                   reading clips over part of the range; sign of the shift not stated
#   constant_reading             fully saturated, the reading no longer varies
#   unknown                      no stated or shown direction
# direction_inferred is my inference, given only where direction is unknown or incomplete,
# with the reasoning in direction_basis or notes. It is not documentation.
#
# Quotes are verbatim from pandoc's plain-text rendering of the arXiv HTML (pandoc 3.12),
# with non-breaking and other Unicode spaces normalised to ASCII spaces. Inline mathematics
# therefore appears in pandoc's notation (e.g. D_(j)^(I) for D^I_j, Ĩ₃ for tilde I_3).
# Each quote sits on one line inside the cited paragraph, caption or table cell.
# YAML anchors (&name) define a source once; later entries reuse it by alias (*name).
#
# Readout symbols (variables.csv): current = C̃, angle_j = θ̃_j, ir_j = Ĩ_j, vis_j = Ṽ_j.
# v_board and v_reg appear in no edge of the published graph (Fig. 3a, Table 5).

uniform_blue_mid:
  parameter: blue
  parameter_symbol: B
  parameter_meaning: brightness setting of the blue LEDs of the main light source
  reference_value: "Unif{0,...,85}"
  intervened_value: "Unif{86,...,170}"
  value_source: &v_blue
    url: https://github.com/juangamella/causal-chamber/blob/0c8a77ea14bd4437b1fdd79adc1aa91ac2342569/datasets/lt_interventions_standard_v1/generators/uniform.py#L45
    quote: |-
      "blue": [(0, 85), (86, 170), (171, 255)],
  data_check: "blue in [86, 170] in all 1000 rows; every other manipulable column within its reference range"
  affected_readouts: [current, ir_1, vis_1, ir_2, vis_2, ir_3, vis_3]
  graph_edges: &e_blue
    - "B → C̃ (Fig. 3a; Table 5 p-value 1.9 × 10⁻¹⁴)"
    - "B → Ĩ₁ (Fig. 3a; Table 5 p-value 1.9 × 10⁻¹⁴)"
    - "B → Ṽ₁ (Fig. 3a; Table 5 p-value 1.9 × 10⁻¹⁴)"
    - "B → Ĩ₂ (Fig. 3a; Table 5 p-value 1.9 × 10⁻¹⁴)"
    - "B → Ṽ₂ (Fig. 3a; Table 5 p-value 1.9 × 10⁻¹⁴)"
    - "B → Ĩ₃ (Fig. 3a; Table 5 p-value 1.9 × 10⁻¹⁴)"
    - "B → Ṽ₃ (Fig. 3a; Table 5 p-value 1.9 × 10⁻¹⁴)"
  direction:
    &d_rgb {
      current: increase,
      ir_1: increase,
      vis_1: unknown,
      ir_2: unknown,
      vis_2: unknown,
      ir_3: unknown,
      vis_3: unknown,
    }
  direction_inferred:
    &di_rgb {
      vis_1: increase,
      ir_2: increase,
      vis_2: increase,
      ir_3: increase,
      vis_3: increase,
    }
  direction_basis: &db_rgb "current and ir_1: Fig. 4d plots Ĩ₁ and C̃ against R, G and B separately, and every series rises (read by eye; blue has the smallest slope on Ĩ₁). Other readouts: the text gives an approximately linear effect whose slope depends on the colour's wavelength and the sensor's spectral sensitivity, and Table 2 says higher settings mean higher brightness, but no sign is stated or plotted for vis_1, ir_2, vis_2, ir_3 or vis_3."
  status: documented
  effects_outside_model_inputs: &o_rgb
    - "Ĩm (camera image): the edge (R, G, B) → Ĩm exists only in the camera configuration (Fig. 3b). This dataset uses the standard configuration, in which the camera is off, so no such readout exists here."
  source: &s_rgb
    - &q_rgb_light
      url: https://arxiv.org/html/2404.11341v2#A2.SS0.SSS0.Px1
      heading: |-
        {R, G, B} → {Ĩ₁, Ĩ₂, Ĩ₃, Ṽ₁, Ṽ₂, Ṽ₃}
      quote: |-
        The brightness settings of the light-source colors (R, G, B) affect the readings of all light-intensity sensors. The effect of each color is approximately linear with heteroscedastic noise (Fig. 4d), with the slope determined by its typical wavelength and the spectral sensitivity of the sensor (see light_source and light_sensor components in App. VI).
    - &q_rgb_current
      url: https://arxiv.org/html/2404.11341v2#A2.SS0.SSS0.Px2
      heading: |-
        {R, G, B} → C̃
      quote: |-
        The brightness settings also affect the electric current drawn by the light source. The effect is again approximately linear with roughly the same slope for each channel (see Fig. 4d).
    - &q_rgb_table
      url: https://arxiv.org/html/2404.11341v2#Ax8.T2
      quote: |-
        The brightness setting of the red, green, and blue LEDs on the main light source. Higher values correspond to higher brightness.
    - &q_fig4
      url: https://arxiv.org/html/2404.11341v2#S4.F4
      quote: |-
        (b,c) numerical data from the light tunnel illustrating the effect of LED brightness (L₁₁, L₁₂) and polarizer angles (θ₁, θ₂) on the light-intensity readings (Ĩ₁, Ĩ₂, Ĩ₃). (d) Effect of the light source setting (R, G, B) on the light intensity reading of the first sensor (Ĩ₁) and drawn current (C̃).
    - &q_table5
      url: https://arxiv.org/html/2404.11341v2#A1.T5
      quote: |-
        Table 5: Results of the validation procedure for the edges of the standard-configuration graph of the light tunnel (Fig. 3a). For each edge, we show the p-value resulting from the Kolmogorov-Smirnov [52] test computed in step 5 of the procedure. All p-values are below 10⁻¹¹.
  notes: &n_rgb "The size of the shift is not documented per readout and should differ across them (slopes set by wavelength and spectral sensitivity). ir_3 and vis_3 also depend on the polarizers, whose settings stay at reference. The light readings have the documented range 0:2¹⁶ − 1; saturation of the light sensors is not discussed anywhere in the documentation. Inference only: Fig. 13 shows Ĩ₁ near 4.7 × 10⁴ at R = 255 with G = B = 0 under the reference sensor settings (D = 2, T = 3), so the strong colour interventions may approach that ceiling on sensor 1; not checked."

