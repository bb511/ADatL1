uniform_v_angle_1_mid:
  parameter: v_angle_1
  parameter_symbol: "R_1"
  parameter_meaning: reference voltage (V) of the ADC reading the angle sensor of polarizer 1; actual values 5, 2.55, 1.09 (Table 3)
  reference_value: 5
  intervened_value: 2.56
  value_source: &v_v_angle_1
    url: https://github.com/juangamella/causal-chamber/blob/0c8a77ea14bd4437b1fdd79adc1aa91ac2342569/datasets/lt_interventions_standard_v1/generators/uniform.py#L52
    quote: |-
      "v_angle_1": [5, 2.56, 1.1],
  data_check: "v_angle_1 = 2.56 in all 1000 rows; every other manipulable column within its reference range"
  affected_readouts: [angle_1]
  graph_edges: ["R₁ → θ̃₁ (Fig. 3a; Table 5 p-value 1.6 × 10⁻¹⁴)"]
  direction: { angle_1: saturation }
  direction_inferred: { angle_1: increase }
  direction_basis: &db_v_angle_mid "Stated: lowering the reference voltage changes the resolution and saturates the angle sensor. Fig. 14 (left) shows the R₁ = 2.56 curve flat for settings above roughly +10° (read by eye), inside the reference range of pol_j, so part of the readings saturate. The sign of the raw shift is not stated for θ̃_j. Inference: the Fig. 12 caption says the current-sensor principles apply to θ̃₁ and θ̃₂, and Fig. 12 (middle) shows the raw reading rising as the reference voltage falls (the ADC maps [0, R] volts to [0, 1023]), so the raw angle reading should rise and clip at the ADC maximum."
  status: documented
  source: &s_v_angle
    - &q_angle_vref
      url: https://arxiv.org/html/2404.11341v2#A2.SS0.SSS0.Px5
      heading: |-
        {θ_(j), R_(j), O_(j)} → θ̃_(j)
      quote: |-
        Changes in the reference voltages R₁, R₂ affect the resolution of the measurements, but can also cause the sensor to saturate (see Fig. 14, left).
    - &q_fig14_vref
      url: https://arxiv.org/html/2404.11341v2#A2.F14
      quote: |-
        Lowering the reference voltage R₁ results in a saturation of the sensor, being completely saturated (i.e., returning a constant reading) at R₁ = 1.1.
    - *q_fig14_same
    - &q_fig12_vref
      url: https://arxiv.org/html/2404.11341v2#A2.F12
      quote: |-
        For a constant oversampling rate (O_(C) = 1), changing the reference voltage results in a shift of the sensor output (middle) and an increase in the resolution of the calibrated measurement (right). While the plots show the current measurement C̃ in the light-tunnel, the same principles apply for the other sensors which encode their measurement as voltage (θ̃₁, θ̃₂, M̃, S̃₁, S̃₂) and for the wind-tunnel barometers (P̃_(dw), P̃_(up), P̃_(amb), P̃_(int)), which also allow for varying oversampling rates (O_(dw), O_(up), O_(amb), O_(int)).
    - &q_table_vref
      url: https://arxiv.org/html/2404.11341v2#Ax8.T2
      quote: |-
        The reference voltage, in volts, of the sensors used to measure the current (C̃) and polarizer angles (θ̃₁, θ̃₂), respectively. The values differ slightly from the actual reference voltages used by the sensors, which can be found in Table 3.
    - *q_table5
  notes: &n_v_angle "Inference, flagged as doubt: the Table 2 calibration (θ̃_j − Z_j) × 720/1023 × vref(R_j)/5 does not reproduce the curves of Fig. 14 (left). The form (θ̃_j × vref(R_j)/5 − Z_j) × 720/1023 does: it gives the identity line at R₁ = 5, clipping near +10° at R₁ = 2.56 when θ̃₁ = 1023, and the constant near −200° at R₁ = 1.1 when θ̃₁ = 1023. This suggests the printed formula is misstated and that the saturated raw value is 1023, but neither point is documented."

