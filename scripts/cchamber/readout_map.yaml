uniform_l_11_mid:
  parameter: l_11
  parameter_symbol: "L_11"
  parameter_meaning: brightness (rheostat wiper position) of the first of the two LEDs placed by light sensor 1
  reference_value: "Unif{0,...,170}"
  intervened_value: "Unif{171,...,255}"
  value_source:
    url: https://github.com/juangamella/causal-chamber/blob/0c8a77ea14bd4437b1fdd79adc1aa91ac2342569/datasets/lt_interventions_standard_v1/generators/uniform.py#L54
    quote: |-
      "l_11": [(0, 170), (171, 255)],
  data_check: "l_11 in [171, 255] in all 1000 rows; every other manipulable column within its reference range"
  affected_readouts: [ir_1, vis_1]
  graph_edges:
    [
      "L₁₁ → Ĩ₁ (Fig. 3a; Table 5 p-value 1.6 × 10⁻¹⁴)",
      "L₁₁ → Ṽ₁ (Fig. 3a; Table 5 p-value 1.6 × 10⁻¹⁴)",
    ]
  direction: { ir_1: increase, vis_1: unknown }
  direction_inferred: { vis_1: increase }
  direction_basis: &db_l_1 "ir_1: Fig. 4b plots Ĩ₁ against L₁₁ and L₁₂ and shows it rising, steeply only near the top of the range (roughly above 190, read by eye); Ĩ₂ and Ĩ₃ stay flat. vis_1: not plotted; the text says only that the readings follow an exponential function of the setting and Table 2 that higher settings mean higher brightness."
  status: documented
  source: &s_led
    - &q_led_text
      url: https://arxiv.org/html/2404.11341v2#A2.SS0.SSS0.Px8
      heading: |-
        {L_(j1), L_(j1)} → Ĩ_(j), Ṽ_(j)
      quote: |-
        Besides the light source, two additional LEDs placed by each light sensor (see Fig. 2d) have an effect on its reading. To avoid affecting the measurements of the other light sensors, the LEDs only turn on when their corresponding sensor is taking a measurement.
    - &q_led_exp
      url: https://arxiv.org/html/2404.11341v2#A2.SS0.SSS0.Px8
      quote: |-
        The settings L_(j1), L_(j2) correspond to the wiper position of each rheostat. The relationship between the setting and the intensity readings follows an exponential function (Fig. 4b), resulting from the LED’s voltage-current characteristic, luminosity response and typical wavelength, and the spectral sensitivity of the sensor. The brightness of the LEDs is much lower than that of the light source (Fig. 15).
    - &q_table_led
      url: https://arxiv.org/html/2404.11341v2#Ax8.T2
      quote: |-
        The brightness of LEDs placed by each light-intensity sensor, where L_(i1), L_(i2) correspond to the two LEDs placed by the i^(th) sensor (Ĩ_(i), Ṽ_(i)). The value corresponds to the wiper position of a digital rheostat, which controls the current flowing to the LED. Higher values correspond to increased brightness.
    - *q_fig4
    - &q_fig15
      url: https://arxiv.org/html/2404.11341v2#A2.F15
      quote: |-
        Because the brightness of the LEDs is very small when compared to that of the light source, their effect on the intensity reading Ĩ₃ is barely noticeable when looking at all observations (left), but becomes apparent, for example, when the polarizers are close to orthogonal (right) and block most of the light emanating from the light source.
    - *q_table5
  notes: &n_led "Expected to be a weak shift: the documentation says the LEDs are much dimmer than the light source and that their effect is barely noticeable across all observations. In the reference distribution the polarizers stay close to aligned (mean cos²(pol_1 − pol_2) = 0.929 over the recorded settings), so the main light source dominates every sensor. The edge heading in the paper reads {L_(j1), L_(j1)} (a typo, also in the LaTeX alt-text); the body text names L_(j1) and L_(j2)."

