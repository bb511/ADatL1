uniform_pol_1_mid:
  parameter: pol_1
  parameter_symbol: "θ_1"
  parameter_meaning: stepper-motor setting of the angle of polarizer 1, in degrees
  reference_value: "Unif{-15,-14.9,...,25} (generator: np.arange(-15, 25 + 0.1, 0.1)); recorded settings are the integers -15..24, see notes"
  intervened_value: "Unif{26,26.1,...,65} (generator: np.arange(26, 65 + 0.1, 0.1)); recorded settings are the integers 26..65, see notes"
  value_source: &v_pol_1
    url: https://github.com/juangamella/causal-chamber/blob/0c8a77ea14bd4437b1fdd79adc1aa91ac2342569/datasets/lt_interventions_standard_v1/generators/uniform.py#L48
    quote: |-
      "pol_1": [(-15, 25), (26, 65), (66, 105)],
  data_check: "pol_1 in [25.9875, 65.025] (40 distinct values) in all 1000 rows; every other manipulable column within its reference range"
  affected_readouts: [angle_1, ir_3, vis_3]
  graph_edges:
    [
      "θ₁ → θ̃₁ (Fig. 3a; Table 5 p-value 3 × 10⁻¹⁴)",
      "θ₁ → Ĩ₃ (Fig. 3a; Table 5 p-value 3 × 10⁻¹⁴)",
      "θ₁ → Ṽ₃ (Fig. 3a; Table 5 p-value 3 × 10⁻¹⁴)",
    ]
  direction: { angle_1: increase, ir_3: unknown, vis_3: unknown }
  direction_inferred: { ir_3: decrease, vis_3: decrease }
  direction_basis: &db_pol "angle_j: Fig. 14 (left) shows the calibrated angle following the motor setting θ₁ along the identity line at R₁ = 5 (read by eye), and the Table 2 calibration rises with θ̃_j, so a larger setting gives a larger raw reading; the caption extends the principles to θ̃₂. ir_3, vis_3: no sign is stated for these setting ranges. Inference from model E1 (I₃ = I₀[(T^(p) − T^(c))cos²(θ₁ − θ₂) + T^(c)], increasing in cos²) and the recorded settings: mean cos²(pol_1 − pol_2) is 0.929 in uniform_reference, 0.574 and 0.586 in pol_1_mid and pol_2_mid, 0.094 and 0.105 in pol_1_strong and pol_2_strong. Fig. 4c shows Ĩ₃ at its maximum for relative angle 0 and its minimum near ±90° (read by eye)."
  status: documented
  effects_outside_model_inputs: &o_pol
    - "Ĩm (camera image): the edges θ₁ → Ĩm and θ₂ → Ĩm exist only in the camera configuration (Fig. 3b). This dataset uses the standard configuration, in which the camera is off, so no such readout exists here."
  source: &s_pol
    - &q_angle_motor
      url: https://arxiv.org/html/2404.11341v2#A2.SS0.SSS0.Px5
      heading: |-
        {θ_(j), R_(j), O_(j)} → θ̃_(j)
      quote: |-
        The motor settings θ₁, θ₂ determine the positions of the polarizer frames. The positions are encoded into a voltage by means of rotary potentiometers, resulting in the measurements θ̃₁, θ̃₂.
    - &q_pol_light
      url: https://arxiv.org/html/2404.11341v2#A2.SS0.SSS0.Px6
      heading: |-
        $\{\theta_{1},\theta_{2}\}\to\{\tilde{I}_{3},\tilde{V}_{3},\tilde{\textmd{I}}\textmd{m}\}$
      quote: |-
        The position of the polarizers affects the intensity and spectral composition (i.e., color) of the light passing through them, affecting the readings (Ĩ₃, Ṽ₃) of the third light sensor (see Fig. 4c and Fig. 17) and the images ($\tilde{\textmd{I}}\textmd{m}$) captured by the camera (see Fig. 4e). The effect is described by Malus’ law—see Section IV.2.1 for more details.
    - &q_malus
      url: https://arxiv.org/html/2404.11341v2#A2.SS1
      quote: |-
        Depending on their angle, the linear polarizers dim the light passing through them.
    - &q_model_e1
      url: https://arxiv.org/html/2404.11341v2#A2.SS1
      quote: |-
        I₃ = I₀[(T^(p) − T^(c))cos²(θ₁ − θ₂) + T^(c)],
    - &q_table_angle
      url: https://arxiv.org/html/2404.11341v2#Ax8.T2
      quote: |-
        $$(\tilde{\theta}_{j}-Z_{j})\times\frac{720}{1023}\times\frac{\text{vref}(R_{j})}{5}\;\text{ degrees},$$
    - &q_table_pol
      url: https://arxiv.org/html/2404.11341v2#Ax8.T2
      quote: |-
        The setting of the stepper motors that control the angle of the polarizer frames, which can be set in increments of 0.1 degrees. Because the mechanism functions without feedback, the actual angle of the polarizers may slightly deviate from this setting due to the imperfect coupling of the mechanical pieces.
    - &q_fig14_same
      url: https://arxiv.org/html/2404.11341v2#A2.F14
      quote: |-
        The same principles apply to the measurements θ̃₂ of the second angle sensor.
    - *q_fig4
    - *q_table5
  notes: &n_pol "Several readouts: angle_j directly and both sensor-3 readouts through Malus' law. Sensor 2 sits between the polarizers and has no edge from θ₁ (Fig. 3a). The strong range puts |pol_1 − pol_2| in [42°, 118°], across 90°, so the transmission is not monotone within it; only its mean falls. Settings: the README and the generator specify a 0.1° grid, but the recorded pol columns take one value per integer degree (40 distinct values in the reference, e.g. -14.9625 for -15 and 23.9625 for 24; 25 never occurs in 10,000 rows; 0 is about twice as frequent and -15 about a tenth as frequent as the other integers). My reading of the generator, not executed: rng.choice returns numpy.float64, which fails type(value) == float, so the value is written with %d and truncated towards zero. The recorded values sit within about 0.05° of the integers, presumably the motor's step quantisation (not documented)."

