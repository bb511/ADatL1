uniform_diode_ir_1_mid:
  parameter: diode_ir_1
  parameter_symbol: "D^I_1"
  parameter_meaning: photodiode used by light sensor 1 (before the polarizers) for its infrared measurement; 0 small, 1 medium, 2 large
  reference_value: 2
  intervened_value: 1
  value_source: &v_diode_ir_1
    url: https://github.com/juangamella/causal-chamber/blob/0c8a77ea14bd4437b1fdd79adc1aa91ac2342569/datasets/lt_interventions_standard_v1/generators/uniform.py#L60
    quote: |-
      "diode_ir_1": [2, 1, 0],
  data_check: "diode_ir_1 = 1 in all 1000 rows; every other manipulable column within its reference range"
  affected_readouts: [ir_1]
  graph_edges: ["D₁^(I) → Ĩ₁ (Fig. 3a; Table 5 p-value 3 × 10⁻¹⁴)"]
  direction: { ir_1: decrease }
  direction_basis: &db_diode_ir "Stated: larger photodiodes increase the sensitivity, and Table 2 maps 0, 1, 2 to small, medium, large, so a smaller photodiode lowers the reading. Shown for Ĩ₁ in Fig. 13 (left): at R = 255, Ĩ₁ is roughly 4.7 × 10⁴, 2.3 × 10⁴ and 1.2 × 10⁴ for D = 2, 1, 0 (read by eye, G = B = 0)."
  status: documented
  source: &s_diode_ir
    - &q_sensor_params
      url: https://arxiv.org/html/2404.11341v2#A2.SS0.SSS0.Px4
      heading: |-
        {D_(j)^(I), T_(j)^(I)} → Ĩ_(j), {D_(j)^(V), T_(j)^(V)} → Ṽ_(j)
      quote: |-
        The measurements of each light sensor are affected by the choice of photodiode (D_(j)^(I), D_(j)^(V)) and gain (T_(j)^(I), T_(j)^(V)) used to perform the infrared (Ĩ_(j)) and visible-light (Ṽ_(j)) readings. Larger photodiodes collect light over a larger area, increasing the sensitivity of the sensor (Fig. 13, left). Higher exposure times achieve a similar effect by increasing the reading duration, which also has an effect on the conditional distribution of the measurements given the light source brightness (Fig. 13, right).
    - &q_table_diode_ir
      url: https://arxiv.org/html/2404.11341v2#Ax8.T2
      quote: |-
        The photodiodes used by the light sensors to take infrared measurements, corresponding to the small (D_(j)^(I) = 0), medium (D_(j)^(I) = 1) and large (D_(j)^(I) = 2) infrared photodiodes onboard.
    - &q_fig13_sens
      url: https://arxiv.org/html/2404.11341v2#A2.F13
      quote: |-
        Increasing the photodiode size (left) or exposure time (center) both increase the sensitivity of the sensor. Due to an interplay between the exposure time and the pulse-width-modulation frequency of the light source, changes in the exposure time also affect the conditional distribution of the measurements given the light-source intensity (R, G, B).
    - *q_table5

