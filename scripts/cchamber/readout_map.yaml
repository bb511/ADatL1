uniform_osr_angle_1_mid:
  parameter: osr_angle_1
  parameter_symbol: "O_1"
  parameter_meaning: oversampling rate of the sensor measuring the angle of polarizer 1 (number of readings averaged per measurement)
  reference_value: 1
  intervened_value: 4
  value_source: &v_osr_angle_1
    url: https://github.com/juangamella/causal-chamber/blob/0c8a77ea14bd4437b1fdd79adc1aa91ac2342569/datasets/lt_interventions_standard_v1/generators/uniform.py#L50
    quote: |-
      "osr_angle_1": [1, 2, 4, 8],
  data_check: "osr_angle_1 = 4 in all 1000 rows; every other manipulable column within its reference range"
  affected_readouts: [angle_1]
  graph_edges: ["O₁ → θ̃₁ (Fig. 3a; Table 5 p-value 8.3 × 10⁻¹⁰¹)"]
  direction: { angle_1: variance_decrease }
  direction_basis: &db_osr_angle "Stated: increasing the oversampling rate increases the precision of the angle sensor (Fig. 14 caption; same principles for θ̃₂). No shift of the mean is stated; Fig. 14 (right) shows the densities for O = 1, 2, 8 all near θ̃₁ ≈ 507 at θ₁ = 0 (read by eye)."
  status: documented
  source: &s_osr_angle
    - &q_angle_osr
      url: https://arxiv.org/html/2404.11341v2#A2.SS0.SSS0.Px5
      heading: |-
        {θ_(j), R_(j), O_(j)} → θ̃_(j)
      quote: |-
        The oversampling rates (O₁, O₂) determine the number of readings that are averaged to produce a single measurement, affecting its precision (Fig. 14, right).
    - &q_fig14_osr
      url: https://arxiv.org/html/2404.11341v2#A2.F14
      quote: |-
        The stochasticity of the measurement is due to electrical noise in the voltage measurement—increasing the oversampling rate O₁ increases the precision of the sensor. The same principles apply to the measurements θ̃₂ of the second angle sensor.
    - &q_table_osr
      url: https://arxiv.org/html/2404.11341v2#Ax8.T2
      quote: |-
        The oversampling rate of the sensors used to measure the current (C̃) and polarizer angles (θ̃₁, θ̃₂), respectively. To avoid affecting the overall measurement time, the chambers always take the maximum number of readings (8) and discard excess readings accordingly.
    - *q_table5
  notes: &n_osr "Inference, not documentation: a measurement that averages O integer ADC readings lies on a grid of step 1/O. Fig. 14 (right) is consistent with this for θ̃₁ (O = 1 at integers, O = 2 at half-integers, O = 8 on a finer grid). An oversampling intervention may therefore be detectable from the readout's quantisation pattern as well as from its spread. The dataset README lists these experiments as uniform_osr_1_* and uniform_osr_2_*; the generator and the data files use uniform_osr_angle_1_* and uniform_osr_angle_2_*."

