# Registration of the Causal Chamber CAP design study (subplan 1, step C).
# Fixed before any pool efficiency or selection result is read; the B axis follows
# the read-only check of 19 Oct on the pool's CAP(beta) curves. Nothing is scored
# until the user has reviewed and committed this file; its SHA-256 at that commit
# identifies it.
version: 1
drafted: 2026-10-07
# CAP becomes the maximum over a beta sweep in place of the optimiser's end point,
# with the sweep's upper bound B as the grid axis in place of beta0; sigmoid_robust
# enters, softmax and exponential leave; each run yields one candidate; scores tied
# with the threshold count fractionally.
amended: 2026-10-19

system:
  dataset: lt_interventions_standard_v1
  md5: 476664d024f88e8b7640998bb5e9ee33
  data_config: configs/data/cchamber.yaml
  split_seed: 314159
  # Rows of uniform_reference.csv; each evaluation split is halved into
  # normal and reference_normal.
  rows: { train: 6000, validation: 2000, test: 2000 }
  interventions: 58
  intervention_rows: { validation: 600, test: 400 }
  readouts:
    [
      current,
      angle_1,
      angle_2,
      ir_1,
      vis_1,
      ir_2,
      vis_2,
      ir_3,
      vis_3,
      v_board,
      v_reg,
    ]
  # Robust per-readout normalisation fitted on the training rows only.
  normalisation:
    { location: median, scale: q95 - q05, scale_floor: 1.0e-6, clip: 10.0 }

# Declared before any selection result is read; they apply to every criterion.
families:
  ae:
    experiment: cchamber/ae_agnostic
    score: residual_oas
    comparison_score: mse
  vae:
    experiment: cchamber/vae_agnostic
    score: residual_oas
    comparison_score: kl
  svdd:
    experiment: cchamber/svdd_agnostic
    score: native
    # Victor's campaign started from a pretrained AE encoder; here from scratch,
    # encoder nodes [128, 64, 16] (user, 18 Oct).
    initialisation: from scratch
  realnvp:
    experiment: cchamber/realnvp_agnostic
    score: native
# residual_oas: (r - mu)^T P (r - mu) / n_observed, r = x - reconstruction
# (VAE: decoder of the posterior mean), mu and P the mean and OAS-shrunk
# precision of r on the 6,000 training normals, refitted at every validation
# epoch (src/callbacks/residual_state.py).

pool:
  seeds: [101, 202, 303]
  # A seed sets the initialisation, the input noise and the batch order
  # (data.train_seed follows it); the split stays with split_seed (user, 18 Oct).
  epochs: 150
  batch_size: 1024
  # 4 families x 17 candidates x 3 seeds = 204 fits. Candidates are copied
  # verbatim from Victor's panel: candidate 000 is the baseline, 001-016 are
  # scrambled Sobol draws from the per-family spaces (POOL_SEED 1729).
  source: >-
    logs/victor_results/cchamber-data/results/cchamber-pairings-v1/panel.yaml
    (olgpu, read-only), sha256
    e572f3e6ed059004e9ee55641137f1ea8da2ab13aac532527effbbed3e438dfa
  stored_per_epoch: >-
    every validation and test set, both scores for AE and VAE, the two
    auxiliary input sets, and the weights (src/callbacks/score_dump.py)
  score_dump:
    keys: [ascore/full, ascore/mse, ascore/kl, ascore/residual_oas]
    # 10,000 standard-normal and 10,000 uniform points over the training bounding
    # box, in normalised input space, for subplan 4.
    aux_seed: 0
    aux_size: 10000

# CAP between validation normal and reference_normal, rank (cdf) pairing fixed.
design_space:
  fixed:
    pairing_type: cdf
    regularization_type: none
    binary: true
    # CAP is the maximum of the mean posterior agreement over n_beta inverse
    # temperatures log-spaced in [beta_min, beta_max], evaluated exactly on all pairs
    # in float64; the curve and its maximiser beta* are stored, and a maximum at the
    # bound is flagged.
    beta_min: 0.01
    n_beta: 200
  normalization_type:
    [sigmoid, sigmoid_robust, log_sigmoid, minmax, rank, rank_mid]
  normalization_mode: [joint, split]
  # Energy parameters other than the adaptive scale stay at their defaults in
  # src/callbacks/metrics/cap/binary/energy.py.
  energy:
    - { energy_type: baseline }
    - { energy_type: adaptive, scale: 0.5 }
    - { energy_type: adaptive, scale: 0.25 }
    - { energy_type: adaptive, scale: 1.0 }
    - { energy_type: focal }
    - { energy_type: margin }
    - { energy_type: contrastive }
  # Fixed after the curve check of 19 Oct on light-tunnel pool scores: all 9,072
  # curves are single-peaked, joint normalisations peak at beta* of about 10-100,
  # split-mode rank configurations at the bound, and the ordering of the candidates
  # depends on the temperature.
  beta_max: [1, 10, 100, 1000]
  # 6 normalisations x 2 modes x 7 energies x 4 B.
  n_configurations: 336
  torch_seed: 20261007

selection:
  # The pipeline's chain, reproduced offline by scripts/cchamber/offline_select.py.
  per_run_candidate: >-
    the epoch at which the EMA (weight 0.9) of the CAP is best, its first strict
    maximum, which is the checkpoint ModelCheckpoint(save_top_k=1) keeps
  per_run_rule: >-
    Q' = CAP recomputed on validation at that epoch, Q'' = ascore_operational of
    normal at the same epoch; no composite rule, no Stable, no last epoch
  across_candidates: >-
    per family and seed, the candidate with the largest Q'; ties broken by the
    lower candidate id

criterion:
  primary: >-
    efficiency of the CAP-selected model at the 1 % false-positive threshold
    (quantile 0.99 of the validation normal scores, interpolation "higher"),
    averaged over the 58 validation interventions, then the 3 seeds, then the
    4 families with equal weight; an event whose score equals the threshold counts
    with the fraction gamma, fixed on the validation normals so that their rate is
    exactly 1 %
  beside: >-
    mean AUPRC on the validation interventions, tabulated for every
    configuration; a disagreement with the primary is stated, never used to choose
  descriptive: test-split efficiency and AUPRC; threshold-drift and Wasserstein rows
  # With rank pairing, rank and rank_mid in split mode give every pair the same
  # values whatever the model, so their CAP cannot rank candidates (user, 18 Oct).
  eligibility: >-
    a configuration whose selected-checkpoint CAP does not vary across the 17
    candidates of any family (relative spread below 1e-6) is reported in the
    design table but cannot be frozen
  rule: >-
    the simplest eligible configuration whose criterion is at least the best
    eligible criterion minus one standard error of the best is frozen
  standard_error:
    method: crossed bootstrap
    # Seeds and the 29 intervention target clusters are resampled
    # independently, with replacement; every intervention of a drawn cluster
    # enters with the cluster's multiplicity. Selection is not rerun.
    units: { seeds: 3, target_clusters: 29 }
    clusters: >-
      logs/victor_results/cchamber-data/results/cchamber-pairings-v1/analysis/intervention_target_clusters.csv
    replicates: 2000
    seed: 271828
    estimate: standard deviation of the best configuration's replicated criterion
  # Lexicographic: energy first, then normalisation, mode, beta_max, adaptive scale.
  simplicity_order:
    energy_type: [baseline, adaptive, focal, margin, contrastive]
    normalization_type:
      [sigmoid, sigmoid_robust, log_sigmoid, minmax, rank, rank_mid]
    normalization_mode: [joint, split]
    beta_max: [1, 10, 100, 1000]
    adaptive_scale: [0.5, 0.25, 1.0]

outputs:
  - design table (configuration x family; criterion, AUPRC, standard errors; drift and Wasserstein rows; the untrained-model reference row)
  - configs/cap/frozen.yaml (the cap config group) and its SHA-256 in configs/cap/frozen.sha256
  - native-score table for AE and VAE under the frozen configuration
  - ranking-validity table and figure per endpoint, with the pairing comparison
  - wind-tunnel test table (held_out_test)

limit_experiments: scripts/cchamber/registration_limits.yaml
secondary: scripts/cchamber/registration_limits.yaml (section secondary)

# Step F.17, run on the downloaded data on 2026-10-18, before this commit.
held_out_test:
  rule: >-
    a reference block of at least 5,000 rows under one documented setting; at
    least ten intervention blocks of at least 400 rows whose intervened variable
    is documented in the dataset's own metadata; the same eleven sensor readouts
    in every block
  accepted:
    dataset: wt_walks_v1
    md5: 19bb4e92cbe0b8dff49299b9b509ac36
    experiment: regime_jumps_single
    rows: 320000
    regimes: 32, flag 0..31, 10,000 rows each (confirmed on the data)
    reference_regime: 0
    intervened_regimes: >-
      26, targets from datasets/wt_walks_v1/regimes_targets.py of the
      causal-chamber repository (commit 0c8a77ea); all 32 regimes confirmed
      against the manipulable columns of the data
    null_regimes: [2, 8, 20, 24, 26]
    readouts:
      [
        pressure_upwind,
        pressure_downwind,
        pressure_ambient,
        pressure_intake,
        mic,
        rpm_in,
        rpm_out,
        current_in,
        current_out,
        signal_1,
        signal_2,
      ]
    # The four actuators load_in, load_out, pot_1 and pot_2 follow one random walk
    # through every regime, the reference included. The user (18 Oct) reads this
    # as the system's normal variation, so regime 0 is one documented setting.
    splits: >-
      reference regime 60/20/20 with each evaluation part halved into normal and
      reference_normal; each intervened regime 60/40 validation/test; the null
      regimes as extra label-0 sets (false-positive check under the walk)
    readout_map: scripts/cchamber/readout_map_wt.yaml
  rejected:
    dataset: wt_validate_v1
    md5: bde214eb50abc801307bf7d4aadcafc9
    reasons: >-
      largest arm 4,045 rows (validate_osr_ambient); seven experiments with arms of
      at least 400 rows; no designated control arm; base settings differ between
      experiments
  fallback: not triggered
  rules: >-
    no CAP parameter is read from the wind tunnel; the wind-tunnel pool may be
    trained before configs/cap/frozen.yaml exists, but no wind-tunnel score is
    read before its hash is recorded; the frozen configuration and the
    light-tunnel selection chain apply unchanged

