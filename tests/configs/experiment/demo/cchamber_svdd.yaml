# @package _global_

defaults:
  - override /data: causal_chamber
  - override /algorithm: svdd
  - override /callbacks: null
  - override /trainer: cpu
  - override /evaluation: null
  - override /evaluation/callbacks: null
  - override /logger: none

seed: 123
tags: ["demo", "causal_chamber", "svdd"]

experiment_name: demo
run_name: cchamber_svdd

data:
  batch_size: 128
  max_val_batches: 1
  signal_experiments:
    - uniform_red_mid
    - uniform_green_mid
    - uniform_blue_mid

algorithm:
  target_rate: 0.01
  base_rate: null
  encoder:
    in_dim: 11
    nodes: [32, 16, 8]

trainer:
  min_epochs: 1
  max_epochs: 1
  limit_train_batches: 2
  limit_val_batches: 1
  limit_test_batches: 0
  enable_checkpointing: false
  enable_model_summary: false
  enable_progress_bar: false

test: false

extras:
  enforce_tags: false
  print_config: false
