# @package _global_

defaults:
  - override /data: synthetic_l1
  - override /algorithm: rvae
  - override /callbacks: null
  - override /trainer: cpu
  - override /evaluation: null
  - override /evaluation/callbacks: null
  - override /logger: none

seed: 123
tags: ["demo", "l1", "rvae"]

experiment_name: demo
run_name: l1_rvae

algorithm:
  encoder:
    in_dim: 57
  decoder:
    nodes: [8, 6, 9]
    out_dim: 57

trainer:
  min_epochs: 1
  max_epochs: 1
  limit_train_batches: 1
  limit_val_batches: 1
  limit_test_batches: 0
  enable_checkpointing: false
  enable_model_summary: false
  enable_progress_bar: false

test: false

extras:
  enforce_tags: false
  print_config: false
